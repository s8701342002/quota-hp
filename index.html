<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>額度血條</title>
<style>html,body{margin:0}body{padding-top:max(16px,env(safe-area-inset-top,0px)) !important}</style>
</head>
<body>
<style>
:root{
  --bg:#fbf6ec;--card:#ffffff;--line:#eadfce;--tx:#1f1c29;--mu:#6f6a80;
  --ok:#1f9d63;--warn:#c98a10;--bad:#d6364a;--ac:#5b47e0;--track:#f0e7d8;--on-ac:#fff;
  --c-cup:#ee8a4e;--c-acc:#b57edc;--c-food:#2fb894;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161d;--card:#242230;--line:#383545;--tx:#f3f1f7;--mu:#a29eb2;
  --ok:#4cd08a;--warn:#f2b84b;--bad:#ef5b6b;--ac:#8f7bff;--track:#14131a;--on-ac:#fff;
  --c-cup:#f5a26b;--c-acc:#cf9cec;--c-food:#5fd6b6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17161d;--card:#242230;--line:#383545;--tx:#f3f1f7;--mu:#a29eb2;
  --ok:#4cd08a;--warn:#f2b84b;--bad:#ef5b6b;--ac:#8f7bff;--track:#14131a;--on-ac:#fff;
  --c-cup:#f5a26b;--c-acc:#cf9cec;--c-food:#5fd6b6;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 104px}
main{max-width:520px;margin:0 auto}
button{font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(120,90,50,.08)}
.row{display:flex;align-items:center;gap:8px}
.sp{justify-content:space-between}
h3{margin:0;font-size:16px}
.mu{color:var(--mu);font-size:12px}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}

/* 頂部三條血條 */
.bars{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.cat{background:var(--card);border-color:var(--line);border-color:color-mix(in srgb,var(--c) 28%,var(--line))}
.cat.open{border-color:var(--c)}
.bar{display:grid;grid-template-columns:68px 1fr auto;column-gap:10px;row-gap:5px;align-items:center;cursor:pointer;outline-offset:4px}
.bm{grid-row:1/4;width:68px;height:68px;object-fit:contain;align-self:center}
.bn b{display:block;font-size:15px;line-height:1.15}
.bn .mu{display:block;line-height:1.2}
.bn .pct{font-size:13px;font-weight:700;margin-left:4px;font-variant-numeric:tabular-nums}
.hp{display:block;height:16px;background:var(--track);border-radius:8px;overflow:hidden;border:1px solid var(--line);grid-column:2/4}
.hp i{display:block;height:100%;border-radius:8px;transition:width .4s,background .4s}
.cups{grid-column:2/4}
.srows{grid-column:2/4;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.srow{display:grid;grid-template-columns:34px 1fr auto;gap:6px;font-size:12px;color:var(--mu);align-items:baseline}
.srow b{color:var(--tx);font-weight:600}
.srow.main{color:var(--tx);font-size:13px}
.srow .over{color:var(--bad);font-weight:700}
.qrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.qrow input{flex:1}
.acts{display:flex;gap:6px;align-items:center}
.qbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--c);color:#fff;font-size:24px;line-height:1;flex:none;box-shadow:0 3px 8px color-mix(in srgb,var(--c) 45%,transparent)}
.qbtn:active{transform:scale(.94)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);
  border-radius:14px;padding:6px 8px 6px 16px;display:flex;align-items:center;gap:8px;font-size:14px;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;font-size:14px;min-height:40px;padding:0 12px;text-decoration:underline}
.gear{border:1px solid var(--line);background:var(--bg);color:var(--mu);border-radius:999px;padding:0 14px;min-height:40px;font-size:13px;white-space:nowrap}
.gear.on{background:var(--c);color:#fff;border-color:var(--c)}
.catbody{border-top:1px dashed var(--line);margin-top:10px;padding-top:2px}
.setbox{background:var(--bg);border-radius:14px;padding:4px 12px 12px;margin-top:12px}
.setbox input{background:var(--card)}
.setbox .seg{background:var(--card)}
.datel{display:flex;align-items:baseline;gap:8px;margin:2px 4px 8px}
.datel b{font-size:16px}
.bv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;line-height:1.15}
.bv small{display:block;font-weight:400;color:var(--mu);font-size:11px}

/* 手搖杯槽 */
.cups{display:flex;gap:1px;min-height:20px;align-items:center}
.cup{font-size:16px;line-height:1;filter:grayscale(1);opacity:.3}
.cup.on{filter:none;opacity:1}
.cup.over{filter:none;opacity:1;border-bottom:2px solid var(--bad)}
.x.buy{color:var(--ac);border:1px solid var(--ac);font-size:13px}

/* 日曆（精簡）*/
.calcard{padding:6px 10px 8px}
.calbar{display:flex;align-items:center;justify-content:space-between;padding:2px 4px;margin-bottom:10px}
.calbtn{flex:1;background:none;border:0;color:var(--tx);font-size:15px;padding:6px 4px;display:flex;align-items:center;justify-content:center;gap:8px}
.calbtn b{font-size:16px}
.calbtn .mu{font-size:12px}
.calbtn .tgl{background:var(--bg);border:1px solid var(--line);color:var(--mu);border-radius:999px;padding:2px 10px;font-size:12px}
.wk{display:flex;gap:5px;align-items:center;justify-content:center;margin-top:5px}
.wk i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--mu);display:block}
.wk i.past{background:var(--mu);opacity:.55;border-color:var(--mu)}
.wk i.now{background:var(--ac);border-color:var(--ac);width:12px;height:12px}
.wk i.pick{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ac)}
.calbtn{flex-direction:column;gap:0}
.calbtn .l1{display:flex;align-items:center;gap:8px}
.calbtn .l3{font-size:12px;color:var(--mu);margin-top:3px}
.weekrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.wcell{background:var(--bg);border:1px solid transparent;border-radius:12px;padding:5px 0 4px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;min-height:62px}
.wcell .w{font-size:11px;color:var(--mu)}
.wcell .n{font-size:16px;font-weight:600;line-height:1.2}
.wcell .c1,.wcell .c2{font-size:10px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.wcell .c1{color:var(--c-cup);font-weight:700}
.wcell .c2{color:var(--mu)}
.wcell.past .n{opacity:.55}
.wcell.future{opacity:.8}
.wcell.now{border-color:var(--mu)}
.wcell.pick{background:var(--ac);color:var(--on-ac)}
.wcell.pick .w,.wcell.pick .c1,.wcell.pick .c2{color:var(--on-ac)}
.wktext{text-align:center;font-size:12px;color:var(--mu);margin-top:6px}
.calbar{display:block}
.calbar .top{display:flex;align-items:center;justify-content:space-between}
.fold{display:block;margin:2px auto 0;background:none;border:0;color:var(--mu);font-size:12px;padding:4px 16px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.calhead b{font-size:15px}
.nav2{background:none;border:0;color:var(--tx);font-size:24px;padding:0 14px;min-height:44px;line-height:1.2}
.today{background:var(--bg);border:1px solid var(--line);color:var(--mu);border-radius:999px;padding:2px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px 2px}
.wd{text-align:center;color:var(--mu);font-size:11px;padding:2px 0}
.day{height:30px;border:0;border-radius:9px;background:none;color:var(--tx);font-size:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;position:relative}
.day.blank{visibility:hidden}
.day.today-d{box-shadow:inset 0 0 0 1.5px var(--mu)}
.day.sel{background:var(--ac);color:var(--on-ac);box-shadow:none}
.dots{display:flex;gap:2px;height:4px}
.dot{width:4px;height:4px;border-radius:50%}
.day.sel .dot{box-shadow:0 0 0 1px var(--on-ac)}

/* 當日三行 */
.erow{display:flex;align-items:center;gap:6px;margin-top:8px}
.erow .add{box-shadow:0 2px 6px color-mix(in srgb,var(--c) 40%,transparent)}
.ei{width:30px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:10px;
  background:var(--bg);border-bottom:3px solid var(--c);flex:none}
input,select{width:100%;min-width:0;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px 10px;font-size:16px;font-family:inherit}
input.am{width:84px;flex:none}
input:focus,select:focus,button:focus-visible,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
.add{min-width:68px;height:44px;flex:none;border:0;border-radius:10px;background:var(--c,var(--ac));color:#fff;font-size:15px;font-weight:700;line-height:1;padding:0 12px}
.other{margin-top:6px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:15;
  padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-shadow:0 -4px 14px rgba(120,90,50,.06)}
.tabs .in{display:flex;max-width:520px;margin:0 auto}
.tabs button{flex:1;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;min-height:52px;padding:6px 0}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--c-cup);font-weight:700}
.ptitle{margin:4px 4px 12px;font-size:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mu);border-radius:999px;padding:0 14px;min-height:40px;font-size:14px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border-radius:14px;padding:10px 8px;text-align:center;background:var(--bg);border-bottom:3px solid var(--c)}
.tile b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--mu)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 2px;width:100%;background:none;border:0;color:var(--tx);padding:6px 0;min-height:40px;text-align:left}
.dayh b{font-size:15px}
.dayh span{font-size:12px;color:var(--mu)}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.lrow i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.lrow .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.lrow b{font-variant-numeric:tabular-nums}
.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.sb{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.sw{position:relative;height:96px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.sbar{width:70%;border-radius:6px 6px 0 0;min-height:2px}
.sq{position:absolute;left:0;right:0;border-top:2px dashed var(--mu);opacity:.7}
.sl{font-size:11px;color:var(--mu)}
.sv{font-size:11px;font-variant-numeric:tabular-nums}
.sb.cur .sl{color:var(--tx);font-weight:700}
.legend{font-size:11px;color:var(--mu);margin-top:6px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.brandrow{display:flex;justify-content:space-between;align-items:center;padding:2px 0}

.elist{margin:2px 0 0 36px}
.elist0{margin:6px 0 0}
.eitem{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:2px 0;gap:6px}
.eitem span:first-child{min-width:0;overflow-wrap:anywhere}
.eitem b{font-variant-numeric:tabular-nums;font-weight:600}
.x{background:none;border:0;color:var(--mu);font-size:15px;padding:0 10px;min-height:40px;min-width:40px;border-radius:10px}
.x.arm{background:var(--bad);color:#fff;font-size:13px}

/* 設定面板 */
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:11px 14px;border-radius:8px;font-size:14px}
.seg button.on{background:var(--ac);color:var(--on-ac)}
label{font-size:13px;color:var(--mu);display:block;margin:10px 0 4px}
.note{border-radius:12px;padding:9px 12px;font-size:14px;margin-top:10px;background:var(--bg)}
.btn{border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:600;background:var(--line);color:var(--tx);width:100%}
textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-family:inherit}
.link{background:none;border:0;color:var(--mu);font-size:13px;text-decoration:underline;padding:8px 0;width:100%}
.sync{font-size:12px;color:var(--mu);text-align:center;margin-top:6px}
</style>

<main id="app"></main>

<script>
const MODE='pwa';
const CATS={
  cup:{name:'手搖',icon:'🥤',count:true,limitLabel:'每期可喝幾杯',defLimit:3,defPeriod:'week',hint:'名稱'},
  acc:{name:'飾品',icon:'💍',count:false,limitLabel:'每期預算（元）',defLimit:1000,defPeriod:'month',hint:'名稱'},
  food:{name:'外送',icon:'🛵',count:false,limitLabel:'每期預算（元）',defLimit:600,defPeriod:'week',hint:'店家'}
};
const KEYS=Object.keys(CATS);
const BRANDS=['50嵐','清心福全','可不可熟成紅茶','迷客夏','大苑子','CoCo都可','麥吉','五桐號','一沐日','龜記','老賴茶棧','得正','COMEBUY','鮮茶道','MR.WISH','青山','珍煮丹','茶湯會','麻古茶坊','鶴茶樓','康青龍','約翰紅茶','天仁茗茶','先喝道','烏弄','八曜和茶','圓石禪茶','再睡5分鐘','日出茶太','春水堂','星巴克','路易莎','85度C'];
const KEY='quota-hp-v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
function norm(){
  if(!S||typeof S!=='object')S={};
  S.cats=S.cats||{};
  for(const k of KEYS){
    const d=S.cats[k]=S.cats[k]||{};
    if(typeof d.limit!=='number')d.limit=CATS[k].defLimit;
    d.period=d.period||CATS[k].defPeriod;
    d.entries=Array.isArray(d.entries)?d.entries:[];
    d.plans=Array.isArray(d.plans)?d.plans:[];
  }
  S.customBrands=Array.isArray(S.customBrands)?S.customBrands:[];
}
norm();

const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const WD=['日','一','二','三','四','五','六'];

const now=new Date();
let sel=ds(now),calY=now.getFullYear(),calM=now.getMonth();
let page='home',logYM=null,logCat='all',armReset=false,qv={},toastMsg='',lastQuick=null,toastT=null,calOpen=false,curCat='cup',setOpen=false,msgCat='',plan='',armed=null,msg='',showIO=false,syncState='';

/* ---- 儲存 ---- */
let dbRef=null,writing=false,dirty=false;
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){msg='手機儲存空間寫入失敗，請先備份';msgCat='io'}
  if(dbRef){dirty=true;flush()}
}
async function flush(){
  if(writing||!dirty)return;
  writing=true;dirty=false;
  try{await dbRef.set(JSON.parse(JSON.stringify(S)));syncState='已同步'}catch(e){syncState='同步失敗，資料仍在本機'}
  writing=false;
  if(dirty)flush();else{const el=document.getElementById('sync');if(el)el.textContent=syncState}
}
async function initDb(){
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const uid=user?await user.id():null;
    if(!db||!uid)return;
    const ref=db.doc('data/users/'+uid+'/state');
    let first=true;
    ref.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites)return;
      if(snap.exists){
        S=JSON.parse(JSON.stringify(snap.data()));norm();
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        syncState='已同步';dbRef=ref;render();
      }else if(!snap.metadata.fromCache&&first){
        dbRef=ref;
        if(KEYS.some(k=>S.cats[k].entries.length)){dirty=true;flush()}else{syncState='已連線'}
        render();
      }
      if(!snap.metadata.fromCache)first=false;
    },()=>{syncState='雲端無法使用，資料存在本機';render()});
  }catch(e){}
}
function initApp(){
  if(MODE==='art'){initDb();return}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ---- 週期計算（以選到的日期所在的那一期為準）---- */
function range(period,ref){
  const r=parse(ref);let s,e;
  if(period==='week'){
    s=new Date(r.getFullYear(),r.getMonth(),r.getDate()-((r.getDay()+6)%7));
    e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+7);
  }else{
    s=new Date(r.getFullYear(),r.getMonth(),1);
    e=new Date(r.getFullYear(),r.getMonth()+1,1);
  }
  return [ds(s),ds(e)];
}
function used(c,ref){
  const [s,e]=range(S.cats[c].period,ref);
  return S.cats[c].entries.filter(x=>x.date>=s&&x.date<e).reduce((a,x)=>a+(CATS[c].count?1:x.amt),0);
}
function prevRef(c,ref){
  const d=parse(range(S.cats[c].period,ref)[0]);d.setDate(d.getDate()-1);return ds(d);
}
const carry=(c,ref)=>Math.max(0,used(c,prevRef(c,ref))-S.cats[c].limit);
const quota=(c,ref)=>Math.max(0,S.cats[c].limit-carry(c,ref));
const fmt=(c,v)=>CATS[c].count?v+' 杯':'$'+Math.round(v).toLocaleString();
function plabel(c,ref){
  const p=S.cats[c].period,[s,e]=range(p,ref),t=ds(new Date());
  const cur=t>=s&&t<e;
  if(p==='month')return cur?'本月':(parse(s).getMonth()+1)+'月';
  const a=parse(s),b=parse(e);b.setDate(b.getDate()-1);
  return cur?'本週':(a.getMonth()+1)+'/'+a.getDate()+'–'+(b.getMonth()+1)+'/'+b.getDate();
}
function usedP(c,p,ref){
  const [a,b]=range(p,ref);
  return S.cats[c].entries.filter(x=>x.date>=a&&x.date<b).reduce((q,x)=>q+(CATS[c].count?1:x.amt),0);
}
function health(c){
  const q=quota(c,sel),u=used(c,sel),left=q-u;
  const ratio=q>0?u/q:(u>0?2:0);
  const fill=Math.max(0,Math.min(100,ratio*100));
  const col=ratio>1?'var(--bad)':ratio>=0.8?'var(--warn)':'var(--c-'+c+')';
  return {q,u,left,ratio,fill,col};
}

/* ---- 畫面 ---- */
function foodStatsHtml(){
  const pre=sel.slice(0,7),m=parse(sel).getMonth()+1;
  const l=S.cats.food.entries.filter(x=>x.date.startsWith(pre));
  const tot=l.reduce((a,x)=>a+x.amt,0);
  return `<div class="note" style="background:var(--card)">${m}月叫了 <b>${l.length}</b> 次外送，共 $${Math.round(tot).toLocaleString()}，平均一單 <b>$${l.length?Math.round(tot/l.length).toLocaleString():0}</b></div>`;
}
function settingsHtml(c){
  const C=CATS[c],D=S.cats[c],per=D.period==='week'?'週':'月',cr=carry(c,sel);
  let h=`<div class="setbox"><label>週期</label>
   <div class="seg"><button class="${D.period==='week'?'on':''}" onclick="setP('${c}','week')">每週</button><button class="${D.period==='month'?'on':''}" onclick="setP('${c}','month')">每月</button></div>
   <label for="lim">${C.limitLabel}</label>
   <input id="lim" type="number" inputmode="decimal" value="${D.limit}" onchange="setL('${c}',this.value)">
   <div class="mu" style="margin-top:6px">週從週一算起。超出額度的部分會從下一期額度扣掉。</div>
   ${cr>0?`<div class="note warn" style="background:var(--card)">上${per}超支 ${fmt(c,cr)}，已從這${per}額度扣掉</div>`:''}
   ${c==='food'?foodStatsHtml():''}`;
  if(C.count){
    h+=`<label for="plan">預知下${per}額度：這${per}還必須再喝幾杯？</label>
     <input id="plan" type="number" inputmode="decimal" placeholder="幾杯" value="${esc(plan)}" oninput="plan=this.value;refreshPlan()">`;
  }else{
    h+=`<label>預約購買（先登記，按「已購買」才扣額度）</label>`;
    h+=D.plans.map(p=>`<div class="eitem"><span>${esc(p.name||'未命名')}</span><span class="row"><b>$${p.amt.toLocaleString()}</b>
       <button class="x buy" onclick="buyPlan('${c}',${p.id})">已購買</button><button class="x" onclick="delPlan('${c}',${p.id})" aria-label="刪除">✕</button></span></div>`).join('');
    h+=`<div class="erow"><input id="pn" placeholder="想買什麼" autocomplete="off"><input id="pa" class="am" type="number" inputmode="decimal" placeholder="金額"><button class="add" onclick="addPlan('${c}')" aria-label="新增預約">＋</button></div>`;
  }
  return h+`<div id="planout"></div></div>`;
}
function entriesHtml(c){
  const C=CATS[c],list=S.cats[c].entries.filter(x=>x.date===sel).sort((a,b)=>a.id-b.id);
  let h='';
  if(list.length)h+=`<div class="elist0">`+list.map(x=>{
    const ar=armed===x.id;
    return `<div class="eitem"><span>${esc(x.name||C.name)}</span><span class="row"><b>${C.count?(x.amt?'1杯 $'+x.amt:'1 杯'):'$'+x.amt.toLocaleString()}</b>
      <button class="x ${ar?'arm':''}" onclick="del('${c}',${x.id})" aria-label="刪除">${ar?'確定刪除':'✕'}</button></span></div>`;
  }).join('')+`</div>`;
  const nameCtl=C.count
    ?`<select id="nm-cup" onchange="brandChange(this.value)" aria-label="品牌">
        <option value="">選品牌（可不選）</option>
        ${allBrands().map(b=>`<option value="${esc(b)}" ${S.lastBrand===b?'selected':''}>${esc(b)}</option>`).join('')}
        <option value="__other" ${S.lastBrand==='__other'?'selected':''}>其他（自行輸入）</option></select>`
    :`<input id="nm-${c}" placeholder="${C.hint}" autocomplete="off">`;
  h+=`<div class="erow">${nameCtl}
    <input id="am-${c}" class="am" type="number" inputmode="decimal" placeholder="${C.count?'價格':'金額'}">
    <button class="add" onclick="add('${c}')" aria-label="新增${C.name}">${C.count?'記一杯':'記下'}</button></div>`;
  if(C.count)h+=`<input id="nm-cup-o" class="other" placeholder="輸入品牌或飲料名稱" autocomplete="off" ${S.lastBrand==='__other'?'':'hidden'}>`;
  if(msg&&msgCat===c)h+=`<div class="note bad">${esc(msg)}</div>`;
  return h;
}

const IMGKEY={cup:'cup',acc:'shop',food:'food'};
function mood(h){return h.ratio>1?'sad':h.ratio>=0.8?'normal':'happy'}
function statRows(c,hh){
  const D=S.cats[c],C=CATS[c],f=v=>C.count?v+' 杯':'$'+Math.round(v).toLocaleString();
  const rows=[['week','本週'],['month','本月']].map(([p,lab])=>{
    const u=usedP(c,p,sel);
    if(p===D.period){
      return `<span class="srow main"><span>${lab}</span><span>已${C.count?'喝':'用'} <b>${f(u)}</b> ／ ${f(hh.q)}</span><span class="${hh.left<0?'over':''}">${hh.left<0?'超支 '+f(-hh.left):'剩 '+f(hh.left)}</span></span>`;
    }
    return `<span class="srow"><span>${lab}</span><span>已${C.count?'喝':'用'} <b>${f(u)}</b></span><span></span></span>`;
  });
  return `<span class="srows">${rows.join('')}</span>`;
}
function catsHtml(){
  let h='';
  return h+KEYS.map(c=>{
    const C=CATS[c],hh=health(c),n=Math.max(hh.q,hh.u),isOpen=curCat===c;
    const im=IMG[IMGKEY[c]+'_'+mood(hh)];
    const meter=C.count&&n>0&&n<=8
      ?`<span class="cups">`+Array.from({length:n},(_,i)=>`<span class="cup ${i<hh.u?'on':''} ${i>=hh.q?'over':''}">${C.icon}</span>`).join('')+`</span>`
      :`<span class="hp" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(hh.fill)}"><i style="width:${hh.fill}%;background:${hh.col}"></i></span>`;
    return `<div class="card cat ${isOpen?'open':''}" style="--c:var(--c-${c})">
      <div class="bar" role="button" tabindex="0" aria-expanded="${isOpen}" onclick="toggleOpen('${c}')" onkeydown="if(event.key==='Enter')toggleOpen('${c}')">
        ${im?`<img class="bm" src="${im}" alt="">`:`<span class="bm" style="font-size:34px;text-align:center">${C.icon}</span>`}
        <span class="bn"><b>${C.name}<span class="pct" style="color:${hh.ratio>1?'var(--bad)':hh.ratio>=0.8?'var(--warn)':'var(--mu)'}">${Math.round(Math.min(hh.ratio,9.99)*100)}%</span></b><span class="mu">${plabel(c,sel)}${pprog(c)}</span></span>
        <span class="acts">${C.count?`<button class="qbtn" onclick="event.stopPropagation();quick('${c}')" aria-label="快速記一杯">＋</button>`:''}
        <button class="gear ${isOpen&&setOpen?'on':''}" onclick="event.stopPropagation();gear('${c}')" aria-label="${C.name}設定">設定</button></span>
        ${meter}
        ${statRows(c,hh)}
      </div>
      ${C.count?'':`<div class="qrow"><input id="qa-${c}" type="number" inputmode="decimal" placeholder="輸入金額，按＋記下" value="${esc(qv[c]||'')}" oninput="qv['${c}']=this.value" onkeydown="if(event.key==='Enter')qadd('${c}')" aria-label="${C.name}金額">
        <button class="qbtn" onclick="qadd('${c}')" aria-label="記下${C.name}">＋</button></div>`}
      ${isOpen?`<div class="catbody">${entriesHtml(c)}${setOpen?settingsHtml(c):''}</div>`:''}
    </div>`;
  }).join('');
}
const short=n=>n>=1000?(Math.round(n/100)/10)+'k':String(Math.round(n));
function weekInfo(ref){
  const t=parse(ds(new Date())),r=parse(ref);
  const s0=new Date(r.getFullYear(),r.getMonth(),r.getDate()-((r.getDay()+6)%7));
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date(s0.getFullYear(),s0.getMonth(),s0.getDate()+i);
    days.push({st:ds(d)<ds(t)?'past':ds(d)===ds(t)?'now':'future',pick:ds(d)===ref});
  }
  const idx=days.findIndex(x=>x.st==='now');
  return {days,idx};
}
function weekText(w){
  if(w.idx>=0)return w.idx===6?'第 7 天・今天是這週最後一天':`第 ${w.idx+1} 天・再撐 ${6-w.idx} 天換新週`;
  return w.days[0].st==='past'?'這週已結束':'這週還沒開始';
}
function pprog(c){
  const p=S.cats[c].period,tk=ds(new Date()),[a,b]=range(p,tk),cur=range(p,sel)[0]===a;
  if(!cur)return '';
  const t=parse(tk);
  if(p==='week')return ` · 第${((t.getDay()+6)%7)+1}/7天`;
  const dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  return ` · 第${t.getDate()}/${dim}天`;
}
function calHtml(){
  if(!calOpen){
    const d=parse(sel),tt=sel===ds(new Date()),w=weekInfo(sel),tk=ds(new Date());
    const s0=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));
    let cells='';
    for(let i=0;i<7;i++){
      const x=new Date(s0.getFullYear(),s0.getMonth(),s0.getDate()+i),k=ds(x),st=k<tk?'past':k===tk?'now':'future';
      const cups=S.cats.cup.entries.filter(e=>e.date===k).length;
      const money=['acc','food'].reduce((a,c)=>a+S.cats[c].entries.filter(e=>e.date===k).reduce((q,e)=>q+e.amt,0),0);
      cells+=`<button class="wcell ${st} ${k===sel?'pick':''}" onclick="pick('${k}')" aria-label="${x.getMonth()+1}月${x.getDate()}日"><span class="w">${WD[x.getDay()]}</span><span class="n">${x.getDate()}</span>
        <span class="c1">${cups?cups+'杯':'&nbsp;'}</span><span class="c2">${money?'$'+short(money):'&nbsp;'}</span></button>`;
    }
    return `<div class="card calbar">
      <div class="top"><button class="nav2" aria-label="上一週" onclick="shiftDay(-7)">‹</button>
        <button class="calbtn" onclick="calOpen=true;render()" aria-label="展開月曆"><span class="l1"><b>${d.getMonth()+1}月${d.getDate()}日</b><span class="mu">週${WD[d.getDay()]}${tt?' · 今天':''}</span><span class="tgl">月曆 ▾</span></span></button>
        <button class="nav2" aria-label="下一週" onclick="shiftDay(7)">›</button></div>
      <div class="weekrow">${cells}</div>
      <div class="wktext">${weekText(w)}</div></div>`;
  }
  const first=new Date(calY,calM,1),lead=(first.getDay()+6)%7,dim=new Date(calY,calM+1,0).getDate();
  const mark={};
  for(const c of KEYS)for(const x of S.cats[c].entries){(mark[x.date]=mark[x.date]||new Set()).add(c)}
  const today=ds(new Date());
  let g=['一','二','三','四','五','六','日'].map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<lead;i++)g+=`<div class="day blank"></div>`;
  for(let d=1;d<=dim;d++){
    const k=calY+'-'+pad(calM+1)+'-'+pad(d),m=mark[k];
    g+=`<button class="day ${k===sel?'sel':''} ${k===today?'today-d':''}" onclick="pick('${k}')">${d}
      <span class="dots">${m?KEYS.filter(c=>m.has(c)).map(c=>`<span class="dot" style="background:var(--c-${c})"></span>`).join(''):''}</span></button>`;
  }
  return `<div class="card calcard">
    <div class="calhead"><button class="nav2" aria-label="上個月" onclick="moveMonth(-1)">‹</button>
      <div class="row"><b>${calY}年${calM+1}月</b><button class="today" onclick="goToday()">今天</button></div>
      <button class="nav2" aria-label="下個月" onclick="moveMonth(1)">›</button></div>
    <div class="grid">${g}</div>
    <button class="fold" onclick="calOpen=false;render()">收合 ▴</button></div>`;
}
function stale(){
  try{
    const t=+localStorage.getItem(KEY+'-bk')||0;
    return KEYS.some(k=>S.cats[k].entries.length)&&Date.now()-t>30*864e5;
  }catch(e){return false}
}
const ICON={
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  log:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  stats:'<path d="M5 20V11M12 20V4M19 20v-6"/>',
  set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
};
const PAGES=[['home','首頁'],['log','紀錄'],['stats','統計'],['set','設定']];
function navHtml(){
  return `<nav class="tabs"><div class="in">`+PAGES.map(([k,n])=>`<button class="${page===k?'on':''}" onclick="go('${k}')" aria-label="${n}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>${n}</button>`).join('')+`</div></nav>`;
}
function go(k){
  page=k;armed=null;msg='';armReset=false;
  if(k==='log'&&!logYM){const t=parse(sel);logYM=[t.getFullYear(),t.getMonth()]}
  render();window.scrollTo(0,0);
}
function goDate(k){const d=parse(k);sel=k;calY=d.getFullYear();calM=d.getMonth();calOpen=false;go('home')}

/* ---- 紀錄 ---- */
function logMove(n){const d=new Date(logYM[0],logYM[1]+n,1);logYM=[d.getFullYear(),d.getMonth()];render()}
function logHtml(){
  if(!logYM){const t=new Date();logYM=[t.getFullYear(),t.getMonth()]}
  const [y,m]=logYM,pre=y+'-'+pad(m+1);
  const inM=c=>S.cats[c].entries.filter(x=>x.date.startsWith(pre));
  const money=c=>inM(c).reduce((a,x)=>a+x.amt,0);
  let h=`<h2 class="ptitle">紀錄</h2><div class="card">
    <div class="calhead"><button class="nav2" aria-label="上個月" onclick="logMove(-1)">‹</button><b>${y}年${m+1}月</b><button class="nav2" aria-label="下個月" onclick="logMove(1)">›</button></div>
    <div class="tiles">
      <div class="tile" style="--c:var(--c-cup)"><b>${inM('cup').length} 杯</b><span>手搖</span></div>
      <div class="tile" style="--c:var(--c-acc)"><b>$${Math.round(money('acc')).toLocaleString()}</b><span>飾品</span></div>
      <div class="tile" style="--c:var(--c-food)"><b>$${Math.round(money('food')).toLocaleString()}</b><span>外送</span></div></div>
    <div class="chips">${[['all','全部'],...KEYS.map(c=>[c,CATS[c].name])].map(([k,n])=>`<button class="chip ${logCat===k?'on':''}" onclick="logCat='${k}';render()">${n}</button>`).join('')}</div>`;
  const rows=[];
  for(const c of KEYS){if(logCat!=='all'&&logCat!==c)continue;for(const x of inM(c))rows.push({c,x})}
  rows.sort((a,b)=>b.x.date.localeCompare(a.x.date)||b.x.id-a.x.id);
  if(!rows.length)return h+`<div class="mu" style="padding:14px 0;text-align:center">這個月還沒有紀錄</div></div>`;
  let cur='';
  for(const {c,x} of rows){
    if(x.date!==cur){
      cur=x.date;
      const d=parse(cur),dr=rows.filter(r=>r.x.date===cur);
      const cups=dr.filter(r=>r.c==='cup').length,mo=dr.filter(r=>r.c!=='cup').reduce((a,r)=>a+r.x.amt,0);
      h+=`<button class="dayh" onclick="goDate('${cur}')"><b>${d.getMonth()+1}/${d.getDate()}　週${WD[d.getDay()]}</b><span>${[cups?cups+' 杯':'',mo?'$'+Math.round(mo).toLocaleString():''].filter(Boolean).join('　')} ›</span></button>`;
    }
    const C=CATS[c],ar=armed===x.id;
    h+=`<div class="lrow" style="--c:var(--c-${c})"><i></i><span class="nm">${esc(x.name||C.name)}</span>
      <b>${C.count?(x.amt?'1杯 $'+x.amt:'1 杯'):'$'+x.amt.toLocaleString()}</b>
      <button class="x ${ar?'arm':''}" onclick="del('${c}',${x.id})" aria-label="刪除">${ar?'確定刪除':'✕'}</button></div>`;
  }
  return h+`</div>`;
}

/* ---- 統計 ---- */
function statsHtml(){
  const t=ds(new Date()),T=parse(t),pre=T.getFullYear()+'-'+pad(T.getMonth()+1);
  let h=`<h2 class="ptitle">統計</h2>`;
  for(const c of KEYS){
    const D=S.cats[c],C=CATS[c],bars=[];
    for(let i=5;i>=0;i--){
      const d=parse(t);
      if(D.period==='week')d.setDate(d.getDate()-7*i);else{d.setDate(1);d.setMonth(d.getMonth()-i)}
      const ref=ds(d),u=used(c,ref),q=quota(c,ref);
      const st=parse(range(D.period,ref)[0]);
      bars.push({u,q,cur:i===0,lab:D.period==='week'?(st.getMonth()+1)+'/'+st.getDate():(st.getMonth()+1)+'月'});
    }
    const mx=Math.max(1,...bars.map(b=>Math.max(b.u,b.q)));
    const f=v=>C.count?String(v):'$'+short(v);
    const per=D.period==='week'?'週':'月';
    const has=bars.filter(b=>b.u>0);
    const avg=has.length?has.reduce((a,b)=>a+b.u,0)/has.length:0;
    h+=`<div class="card" style="--c:var(--c-${c})"><div class="row sp"><h3>${C.icon} ${C.name}</h3><span class="mu">近 6 ${per}・每${per}額度 ${fmt(c,D.limit)}</span></div>
      <div class="chart">${bars.map(b=>`<div class="sb ${b.cur?'cur':''}"><div class="sw"><div class="sbar" style="height:${b.u/mx*100}%;background:${b.u>b.q?'var(--bad)':b.q>0&&b.u/b.q>=0.8?'var(--warn)':'var(--c)'}"></div><div class="sq" style="bottom:${b.q/mx*100}%"></div></div><div class="sv">${f(b.u)}</div><div class="sl">${b.lab}</div></div>`).join('')}</div>
      <div class="legend">虛線是當期額度，紅色是超支</div>
      <div class="kv" style="margin-top:8px"><span>平均每${per}（有紀錄的）</span><b>${C.count?avg.toFixed(1)+' 杯':'$'+Math.round(avg).toLocaleString()}</b></div>
      <div class="kv"><span>最高一${per}</span><b>${fmt(c,Math.max(0,...bars.map(b=>b.u)))}</b></div>`;
    const mEnt=S.cats[c].entries.filter(x=>x.date.startsWith(pre));
    if(c==='cup'){
      const cnt={};for(const x of mEnt)if(x.name)cnt[x.name]=(cnt[x.name]||0)+1;
      const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3);
      const spent=mEnt.reduce((a,x)=>a+x.amt,0);
      h+=`<div class="kv"><span>${T.getMonth()+1}月共喝</span><b>${mEnt.length} 杯${spent?'・$'+Math.round(spent).toLocaleString():''}</b></div>`;
      h+=top.length?`<div class="kv"><span>最常喝</span><b>${top.map(([n,k])=>esc(n)+' '+k).join('　')}</b></div>`:'';
    }else if(c==='acc'){
      const rs=D.plans.reduce((a,p)=>a+p.amt,0);
      h+=`<div class="kv"><span>${T.getMonth()+1}月共花</span><b>$${Math.round(mEnt.reduce((a,x)=>a+x.amt,0)).toLocaleString()}</b></div>`;
      if(rs)h+=`<div class="kv"><span>預約中（還沒買）</span><b>$${rs.toLocaleString()}</b></div>`;
    }else{
      const tot=mEnt.reduce((a,x)=>a+x.amt,0);
      h+=`<div class="kv"><span>${T.getMonth()+1}月叫了</span><b>${mEnt.length} 次・$${Math.round(tot).toLocaleString()}</b></div>
        <div class="kv"><span>平均一單</span><b>$${mEnt.length?Math.round(tot/mEnt.length).toLocaleString():0}</b></div>`;
    }
    h+=`</div>`;
  }
  return h;
}

/* ---- 設定 ---- */
function resetAll(){
  if(!armReset){armReset=true;render();setTimeout(()=>{if(armReset){armReset=false;if(page==='set')render()}},4000);return}
  armReset=false;S={};norm();persist();curCat='cup';showToast('已清除全部資料');lastQuick=null;render();
}
function ioBody(){
  let h=(msg&&msgCat==='io'?`<div class="note bad">${esc(msg)}</div>`:'');
  if(MODE==='pwa')h+=`<button class="btn" onclick="saveFile()">存成檔案（存到「檔案」App）</button>
    <div style="height:8px"></div><button class="btn" onclick="document.getElementById('fi').click()">從檔案還原</button>
    <input id="fi" type="file" accept=".json,application/json" style="display:none" onchange="impFile(this)">`;
  h+=`<label for="io">備份文字：複製存起來；要還原就貼上後按「還原文字」</label>
    <textarea id="io" rows="4">${esc(JSON.stringify(S))}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn" onclick="copyIO()">複製</button><button class="btn" onclick="impIO()">還原文字</button></div>`;
  return h;
}
function setPageHtml(){
  let h=`<h2 class="ptitle">設定</h2>
   <div class="card"><h3>各項額度</h3>
    <div class="mu" style="margin:4px 0 8px">週期和額度，回首頁點卡片右邊的「設定」修改。</div>
    ${KEYS.map(c=>{const D=S.cats[c];return `<div class="kv"><span>${CATS[c].icon} ${CATS[c].name}</span><b>每${D.period==='week'?'週':'月'} ${fmt(c,D.limit)}</b></div>`}).join('')}</div>
   <div class="card"><h3>手搖品牌</h3>
    <div class="mu" style="margin:4px 0 8px">加你常喝、清單沒有的品牌，會出現在手搖的下拉選單。</div>
    <div class="erow" style="margin-top:0"><input id="nb" placeholder="品牌名稱" autocomplete="off" onkeydown="if(event.key==='Enter')addBrand()"><button class="add" style="--c:var(--c-cup)" onclick="addBrand()">加入</button></div>
    ${S.customBrands.map((b,i)=>`<div class="brandrow"><span>${esc(b)}</span><button class="x" onclick="delBrand(${i})" aria-label="刪除">✕</button></div>`).join('')}</div>
   <div class="card"><h3>備份 / 還原</h3>${ioBody()}</div>
   <div class="card"><h3>清除資料</h3><div class="mu" style="margin:4px 0 8px">會刪掉全部紀錄、預約和設定，無法復原。請先備份。</div>
    <button class="btn" style="background:${armReset?'var(--bad)':'var(--line)'};color:${armReset?'#fff':'var(--tx)'}" onclick="resetAll()">${armReset?'再按一次確定清除':'清除全部資料'}</button></div>`;
  h+=`<div class="card"><h3>關於</h3><div class="mu" style="margin-top:4px">${MODE==='art'?'資料存在你的 Claude 帳號雲端，只有你看得到，手機和電腦同步。':'資料只存在這支手機的瀏覽器裡，不會上傳。清除網站資料會一併消失，請定期備份。'}</div></div>`;
  return h;
}
function syncHtml(){return MODE==='art'?`<div class="sync" id="sync">${esc(syncState)}</div>`:''}
function render(){
  let h='';
  if(page==='home'){
    if(MODE==='pwa'&&stale())h+=`<button class="card" style="width:100%;text-align:left;color:var(--tx)" onclick="go('set')"><b class="warn">超過 30 天沒備份了</b><div class="mu">點這裡到「設定」存成檔案，放進「檔案」App。</div></button>`;
    h+=calHtml()+catsHtml()+syncHtml();
  }else if(page==='log')h+=logHtml();
  else if(page==='stats')h+=statsHtml();
  else h+=setPageHtml()+syncHtml();
  if(toastMsg)h+=`<div class="toast" id="toast"><span>${esc(toastMsg)}</span>${lastQuick?`<button onclick="undoQuick()">復原</button>`:''}</div>`;
  h+=navHtml();
  document.getElementById('app').innerHTML=h;
  refreshPlan();
}
function refreshPlan(){
  const el=document.getElementById('planout');if(!el||!curCat)return;
  const c=curCat,D=S.cats[c],C=CATS[c];
  const pu=C.count?(parseFloat(plan)||0):D.plans.reduce((a,p)=>a+p.amt,0);
  if(!pu){el.innerHTML='';return}
  const after=quota(c,sel)-used(c,sel)-pu,per=D.period==='week'?'週':'月',over=Math.max(0,-after);
  const what=C.count?'買完':'預約的全買下後，';
  el.innerHTML=after>=0
    ?`<div class="note ok">${what}這${per}還剩 ${fmt(c,after)}，下${per}額度維持 ${fmt(c,D.limit)}</div>`
    :`<div class="note bad">${what}這${per}會超支 ${fmt(c,over)}<br>下${per}額度 ${fmt(c,D.limit)} → <b>${fmt(c,Math.max(0,D.limit-over))}</b></div>`;
}

/* ---- 動作 ---- */
function pick(k){sel=k;armed=null;msg='';calOpen=false;render()}
function shiftDay(n){
  const d=parse(sel);d.setDate(d.getDate()+n);
  sel=ds(d);calY=d.getFullYear();calM=d.getMonth();armed=null;msg='';plan='';render();
}
function moveMonth(n){const d=new Date(calY,calM+n,1);calY=d.getFullYear();calM=d.getMonth();render()}
function goToday(){const t=new Date();calY=t.getFullYear();calM=t.getMonth();sel=ds(t);calOpen=false;render()}
function showToast(m){
  toastMsg=m;clearTimeout(toastT);
  toastT=setTimeout(()=>{toastMsg='';lastQuick=null;const t=document.getElementById('toast');if(t&&t.remove)t.remove()},4000);
}
function quick(c){
  if(CATS[c].count){
    const id=Date.now();
    const nm=S.lastBrand&&S.lastBrand!=='__other'?S.lastBrand:'';
    S.cats[c].entries.push({id,date:sel,name:nm,amt:0});
    lastQuick={c,id};persist();showToast('已記一杯'+(nm?'・'+nm:''));render();return;
  }
  curCat=c;setOpen=false;plan='';msg='';render();
  setTimeout(()=>{const e=document.getElementById('am-'+c);if(e&&e.focus)e.focus()},0);
}
const allBrands=()=>BRANDS.concat(S.customBrands.filter(b=>!BRANDS.includes(b)));
function addBrand(){
  const el=document.getElementById('nb'),v=el?el.value.trim():'';
  if(!v){showToast('請輸入品牌名稱');lastQuick=null;render();return}
  if(!allBrands().includes(v))S.customBrands.push(v);
  persist();render();
}
function delBrand(i){S.customBrands.splice(i,1);persist();render()}
function brandChange(v){
  S.lastBrand=v;persist();
  const o=document.getElementById('nm-cup-o');
  if(o){o.hidden=v!=='__other';if(v==='__other')o.focus()}
}
function qadd(c){
  const a=parseFloat(qv[c])||0;
  if(!(a>0)){showToast('請先輸入金額');lastQuick=null;render();return}
  const id=Date.now();
  S.cats[c].entries.push({id,date:sel,name:'',amt:a});
  qv[c]='';lastQuick={c,id};persist();showToast('已記 '+CATS[c].name+' $'+Math.round(a).toLocaleString());render();
}
function undoQuick(){
  if(!lastQuick)return;
  S.cats[lastQuick.c].entries=S.cats[lastQuick.c].entries.filter(x=>x.id!==lastQuick.id);
  lastQuick=null;toastMsg='';clearTimeout(toastT);persist();render();
}
function toggleOpen(c){curCat=curCat===c?null:c;setOpen=false;plan='';msg='';render()}
function gear(c){
  if(curCat!==c){curCat=c;setOpen=true}else setOpen=!setOpen;
  plan='';msg='';render();
}
function setP(c,p){S.cats[c].period=p;plan='';persist();render()}
function setL(c,v){S.cats[c].limit=Math.max(0,parseFloat(v)||0);persist();render()}
function add(c){
  const C=CATS[c];
  let name=document.getElementById('nm-'+c).value.trim();
  if(c==='cup'&&name==='__other'){const o=document.getElementById('nm-cup-o');name=o?o.value.trim():''}
  const a=parseFloat(document.getElementById('am-'+c).value)||0;
  if(!C.count&&!(a>0)){msg='請輸入'+C.name+'的金額';msgCat=c;render();return}
  msg='';
  S.cats[c].entries.push({id:Date.now(),date:sel,name,amt:a});
  persist();render();
}
function del(c,id){
  if(armed!==id){armed=id;render();setTimeout(()=>{if(armed===id){armed=null;render()}},3000);return}
  armed=null;
  S.cats[c].entries=S.cats[c].entries.filter(x=>x.id!==id);persist();render();
}
function addPlan(c){
  const name=document.getElementById('pn').value.trim();
  const a=parseFloat(document.getElementById('pa').value)||0;
  if(!(a>0)){msg='請輸入預約金額';msgCat=c;render();return}
  msg='';S.cats[c].plans.push({id:Date.now(),name,amt:a});persist();render();
}
function delPlan(c,id){S.cats[c].plans=S.cats[c].plans.filter(p=>p.id!==id);persist();render()}
function buyPlan(c,id){
  const p=S.cats[c].plans.find(x=>x.id===id);if(!p)return;
  const t=new Date();
  S.cats[c].plans=S.cats[c].plans.filter(x=>x.id!==id);
  S.cats[c].entries.push({id:Date.now(),date:ds(t),name:p.name,amt:p.amt});
  calY=t.getFullYear();calM=t.getMonth();sel=ds(t);
  persist();render();
}
function markBk(){try{localStorage.setItem(KEY+'-bk',String(Date.now()))}catch(e){}}
async function saveFile(){
  const txt=JSON.stringify(S),name='額度血條備份.json';
  try{
    const f=new File([txt],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});markBk();msg='';render();return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;a.click();markBk();
  }catch(e){msg='無法存成檔案，請改用複製文字';msgCat='io';render()}
}
function applyBackup(text){
  try{const j=JSON.parse(text);if(!j.cats)throw 0;S=j;norm();persist();showIO=false;msg='';lastQuick=null;showToast('已還原');render()}
  catch(e){msg='備份格式不對';msgCat='io';render()}
}
function impFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>applyBackup(r.result);r.readAsText(f)}
function impIO(){applyBackup(document.getElementById('io').value)}
function copyIO(){
  const t=document.getElementById('io');t.select();
  try{navigator.clipboard.writeText(t.value).catch(()=>{});markBk()}catch(e){}
}
render();
initApp();
</script>

</body>
</html>
