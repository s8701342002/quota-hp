<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="花小兔的額度屋">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#5b47e0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>花小兔的額度屋</title>
<style>html,body{margin:0}body{padding-top:max(16px,env(safe-area-inset-top,0px)) !important}</style>
</head>
<body>
<style>
:root{
  --bg:#fbf6ec;--card:#ffffff;--line:#eadfce;--tx:#1f1c29;--mu:#6f6a80;
  --ok:#1f9d63;--warn:#c98a10;--bad:#d6364a;--ac:#5b47e0;--track:#f0e7d8;--on-ac:#fff;
  --c-cup:#ee8a4e;--c-acc:#b57edc;--c-food:#2fb894;
  --c-lsleep:#6c7ae0;--c-lfood:#ee8a4e;--c-lexercise:#e0607e;--c-lwater:#2fb0c9;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161d;--card:#242230;--line:#383545;--tx:#f3f1f7;--mu:#a29eb2;
  --ok:#4cd08a;--warn:#f2b84b;--bad:#ef5b6b;--ac:#8f7bff;--track:#14131a;--on-ac:#fff;
  --c-cup:#f5a26b;--c-acc:#cf9cec;--c-food:#5fd6b6;
  --c-lsleep:#98a3ff;--c-lfood:#f5a26b;--c-lexercise:#f58aa3;--c-lwater:#63cfe3;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17161d;--card:#242230;--line:#383545;--tx:#f3f1f7;--mu:#a29eb2;
  --ok:#4cd08a;--warn:#f2b84b;--bad:#ef5b6b;--ac:#8f7bff;--track:#14131a;--on-ac:#fff;
  --c-cup:#f5a26b;--c-acc:#cf9cec;--c-food:#5fd6b6;
  --c-lsleep:#98a3ff;--c-lfood:#f5a26b;--c-lexercise:#f58aa3;--c-lwater:#63cfe3;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 104px}
main{max-width:520px;margin:0 auto}
button{font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(120,90,50,.08)}
.row{display:flex;align-items:center;gap:8px}
.sp{justify-content:space-between}
h3{margin:0;font-size:16px}
.mu{color:var(--mu);font-size:12px}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}

/* 頂部三條血條 */
.bars{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.cat{background:var(--card);border-color:var(--line);border-color:color-mix(in srgb,var(--c) 28%,var(--line))}
.cat.open{border-color:var(--c)}
.bar{display:grid;grid-template-columns:68px 1fr auto;column-gap:10px;row-gap:5px;align-items:center;cursor:pointer;outline-offset:4px}
.bm{grid-row:1/4;width:68px;height:68px;object-fit:contain;align-self:center}
.bn b{display:block;font-size:15px;line-height:1.15}
.bn .mu{display:block;line-height:1.2}
.bn .pct{font-size:13px;font-weight:700;margin-left:4px;font-variant-numeric:tabular-nums}
.hp{display:block;height:16px;background:var(--track);border-radius:8px;overflow:hidden;border:1px solid var(--line);grid-column:2/4}
.hp i{display:block;height:100%;border-radius:8px;transition:width .4s,background .4s}
.cups{grid-column:2/4}
.srows{grid-column:2/4;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.srow{display:grid;grid-template-columns:34px 1fr auto;gap:6px;font-size:12px;color:var(--mu);align-items:baseline}
.srow b{color:var(--tx);font-weight:600}
.srow.main{color:var(--tx);font-size:13px}
.srow .over{color:var(--bad);font-weight:700}
.qrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.qrow input{flex:1}
.acts{display:flex;gap:6px;align-items:center}
.qbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--c);color:#fff;font-size:24px;line-height:1;flex:none;box-shadow:0 3px 8px color-mix(in srgb,var(--c) 45%,transparent)}
.qbtn:active{transform:scale(.94)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);
  border-radius:14px;padding:6px 8px 6px 16px;display:flex;align-items:center;gap:8px;font-size:14px;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;font-size:14px;min-height:40px;padding:0 12px;text-decoration:underline}
.gear{border:1px solid var(--line);background:var(--bg);color:var(--mu);border-radius:999px;padding:0 14px;min-height:40px;font-size:13px;white-space:nowrap}
.gear.on{background:var(--c);color:#fff;border-color:var(--c)}
.catbody{border-top:1px dashed var(--line);margin-top:10px;padding-top:2px}
.setbox{background:var(--bg);border-radius:14px;padding:4px 12px 12px;margin-top:12px}
.setbox input{background:var(--card)}
.setbox .seg{background:var(--card)}
.datel{display:flex;align-items:baseline;gap:8px;margin:2px 4px 8px}
.datel b{font-size:16px}
.bv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;line-height:1.15}
.bv small{display:block;font-weight:400;color:var(--mu);font-size:11px}

/* 手搖杯槽 */
.cups{display:flex;gap:1px;min-height:20px;align-items:center}
.cup{font-size:16px;line-height:1;filter:grayscale(1);opacity:.3}
.cup.on{filter:none;opacity:1}
.cup.over{filter:none;opacity:1;border-bottom:2px solid var(--bad)}
.x.buy{color:var(--ac);border:1px solid var(--ac);font-size:13px}

/* 日曆（精簡）*/
.calcard{padding:6px 10px 8px}
.calbar{display:flex;align-items:center;justify-content:space-between;padding:2px 4px;margin-bottom:10px}
.calbtn{flex:1;background:none;border:0;color:var(--tx);font-size:15px;padding:6px 4px;display:flex;align-items:center;justify-content:center;gap:8px}
.calbtn b{font-size:16px}
.calbtn .mu{font-size:12px}
.calbtn .tgl{background:var(--bg);border:1px solid var(--line);color:var(--mu);border-radius:999px;padding:2px 10px;font-size:12px}
.wk{display:flex;gap:5px;align-items:center;justify-content:center;margin-top:5px}
.wk i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--mu);display:block}
.wk i.past{background:var(--mu);opacity:.55;border-color:var(--mu)}
.wk i.now{background:var(--ac);border-color:var(--ac);width:12px;height:12px}
.wk i.pick{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ac)}
.calbtn{flex-direction:column;gap:0}
.calbtn .l1{display:flex;align-items:center;gap:8px}
.calbtn .l3{font-size:12px;color:var(--mu);margin-top:3px}
.weekrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.wcell{background:var(--bg);border:1px solid transparent;border-radius:12px;padding:5px 0 4px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;min-height:62px}
.wcell .w{font-size:11px;color:var(--mu)}
.wcell .n{font-size:16px;font-weight:600;line-height:1.2}
.wcell .c1,.wcell .c2{font-size:10px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.wcell .c1{color:var(--c-cup);font-weight:700}
.wcell .c2{color:var(--mu)}
.wcell.past .n{opacity:.55}
.wcell.future{opacity:.8}
.wcell.now{border-color:var(--mu)}
.wcell.pick{background:var(--ac);color:var(--on-ac)}
.wcell.pick .w,.wcell.pick .c1,.wcell.pick .c2{color:var(--on-ac)}
.wktext{text-align:center;font-size:12px;color:var(--mu);margin-top:6px}
.calbar{display:block}
.calbar .top{display:flex;align-items:center;justify-content:space-between}
.fold{display:block;margin:2px auto 0;background:none;border:0;color:var(--mu);font-size:12px;padding:4px 16px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.calhead b{font-size:15px}
.nav2{background:none;border:0;color:var(--tx);font-size:24px;padding:0 14px;min-height:44px;line-height:1.2}
.today{background:var(--bg);border:1px solid var(--line);color:var(--mu);border-radius:999px;padding:2px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px 2px}
.wd{text-align:center;color:var(--mu);font-size:11px;padding:2px 0}
.day{height:30px;border:0;border-radius:9px;background:none;color:var(--tx);font-size:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;position:relative}
.day.blank{visibility:hidden}
.day.today-d{box-shadow:inset 0 0 0 1.5px var(--mu)}
.day.sel{background:var(--ac);color:var(--on-ac);box-shadow:none}
.dots{display:flex;gap:2px;height:4px}
.dot{width:4px;height:4px;border-radius:50%}
.day.sel .dot{box-shadow:0 0 0 1px var(--on-ac)}

/* 小兔房間、簽到 */
.ropts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ropt{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:8px 4px;color:var(--tx);min-height:92px;justify-content:center}
.ropt .em{font-size:30px;line-height:1.1}
.ropt .sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.ropt b{font-size:13px}
.ropt small{font-size:11px;color:var(--mu);text-align:center}
.ropt.on{border-color:var(--c-acc);background:color-mix(in srgb,var(--c-acc) 14%,var(--card))}
.ropt.lock{opacity:.5}
.ckweek{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ckmonth{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.ckmonth .wd{text-align:center;color:var(--mu);font-size:11px}
.ckc{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--bg);border-radius:12px;padding:5px 0 4px;border:1.5px solid transparent;min-width:0}
.ckc .w{font-size:11px;color:var(--mu)}
.ckc .n{font-size:13px;font-weight:600}
.ckc i{font-style:normal;font-size:18px;height:26px;line-height:26px;display:flex;align-items:center}
.ckc i img{height:26px;width:auto;display:block}
.ropt img.em{width:46px;height:46px;object-fit:contain}
.ckpop .rb{height:72px;width:auto;display:block;margin:-6px auto 2px;animation:rbhop .6s .2s ease-out}
@keyframes rbhop{0%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-6deg)}100%{transform:translateY(0)}}
.ckc.on{background:color-mix(in srgb,var(--c-acc) 16%,var(--card));border-color:var(--c-acc)}
.ckc.now{border-color:var(--mu)}
.ckc.on.now{border-color:var(--c-acc)}
.ckc.fut{opacity:.45}
.ckc.just i{animation:stampin .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{0%{transform:scale(3) rotate(-30deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0)}}
.ckbtn{display:block;width:100%;margin-top:12px;border:0;border-radius:16px;min-height:54px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--c-acc),var(--ac));box-shadow:0 5px 0 color-mix(in srgb,var(--ac) 60%,#000),0 8px 16px color-mix(in srgb,var(--ac) 35%,transparent);animation:ckpulse 1.8s ease-in-out infinite;transition:transform .08s,box-shadow .08s}
.ckbtn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--ac) 60%,#000)}
.ckbtn.done{background:var(--track);color:var(--mu);box-shadow:none;animation:none;font-weight:600}
@keyframes ckpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.ckfx{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.ckfx .pt{position:absolute;left:50%;top:42%;font-size:24px;opacity:0;animation:ckfly 1.4s ease-out forwards}
@keyframes ckfly{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(1.1);opacity:0}}
.ckpop{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:var(--card);color:var(--tx);border:2px solid var(--c-acc);border-radius:24px;padding:18px 30px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:ckin .55s cubic-bezier(.2,1.5,.4,1) both,ckout .4s 2s forwards;max-width:calc(100vw - 48px)}
.ckpop .t{font-size:15px;color:var(--mu)}
.ckpop .e{font-size:40px;font-weight:900;color:var(--c-acc);line-height:1.15}
.ckpop .s{font-size:13px;margin-top:2px}
.ckpop .x2{font-size:13px;margin-top:6px;color:var(--ok);font-weight:700}
@keyframes ckin{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes ckout{to{opacity:0;transform:translate(-50%,-60%) scale(.9)}}
@media (prefers-reduced-motion:reduce){.ckfx .pt{display:none}.ckbtn{animation:none}}

/* 當日三行 */
.erow{display:flex;align-items:center;gap:6px;margin-top:8px}
.erow .add{box-shadow:0 2px 6px color-mix(in srgb,var(--c) 40%,transparent)}
.ei{width:30px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:10px;
  background:var(--bg);border-bottom:3px solid var(--c);flex:none}
input,select{width:100%;min-width:0;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px 10px;font-size:16px;font-family:inherit}
input.am{width:84px;flex:none}
input:focus,select:focus,button:focus-visible,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
.add{min-width:68px;height:44px;flex:none;border:0;border-radius:10px;background:var(--c,var(--ac));color:#fff;font-size:15px;font-weight:700;line-height:1;padding:0 12px}
.other{margin-top:6px}
.pet{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;cursor:pointer}
.pm{width:76px;height:76px;object-fit:contain}
.xp{height:10px;border-radius:5px;background:var(--track);overflow:hidden;margin:5px 0 2px;border:1px solid var(--line)}
.xp i{display:block;height:100%;background:var(--c-acc);border-radius:5px;transition:width .5s}
.say{background:var(--bg);border-radius:12px;padding:7px 10px;font-size:13px;margin-top:6px;line-height:1.35}
.elog{grid-column:1/3;border-top:1px dashed var(--line);margin-top:2px;padding-top:6px}
.elog div{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mu);padding:3px 0}
.elog b{color:var(--c-acc);font-variant-numeric:tabular-nums;white-space:nowrap}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:15;
  padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-shadow:0 -4px 14px rgba(120,90,50,.06)}
.tabs .in{display:flex;max-width:520px;margin:0 auto}
.tabs button{position:relative;flex:1;min-width:0;white-space:nowrap;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;min-height:52px;padding:6px 0}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--c-cup);font-weight:700}
.task{padding:8px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.tl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.tc{font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.task .xp{margin:6px 0 0}
.claim{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.claim:first-of-type{border-top:0}
.claim button{background:var(--c-acc);color:#fff;border:0;border-radius:999px;min-height:40px;padding:0 16px;font-weight:700;font-size:14px;white-space:nowrap}
.dot2{position:absolute;top:6px;left:calc(50% + 7px);width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0}
.opt .seg{width:112px;flex:none}
.hgrp{margin:12px 0 2px;font-size:13px;color:var(--mu)}
.hrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--tx);font-size:15px;text-align:left}
.hrow .st{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--ac);color:var(--on-ac)}
.hrow.off{color:var(--mu)}
.hrow.off .st{background:var(--line);color:var(--mu)}
.opt small{display:block;color:var(--mu);font-size:12px}
.bar.nomas{grid-template-columns:44px 1fr auto}
.bar.nomas .bm{width:44px;height:44px;font-size:28px !important;display:flex;align-items:center;justify-content:center}
.ptitle{margin:4px 4px 12px;font-size:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mu);border-radius:999px;padding:0 14px;min-height:40px;font-size:14px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border-radius:14px;padding:10px 8px;text-align:center;background:var(--bg);border-bottom:3px solid var(--c)}
.tile b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--mu)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 2px;width:100%;background:none;border:0;color:var(--tx);padding:6px 0;min-height:40px;text-align:left}
.dayh b{font-size:15px}
.dayh span{font-size:12px;color:var(--mu)}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.lrow i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.lrow .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.lrow b{font-variant-numeric:tabular-nums}
.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.sb{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.sw{position:relative;height:96px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.sbar{width:70%;border-radius:6px 6px 0 0;min-height:2px}
.sq{position:absolute;left:0;right:0;border-top:2px dashed var(--mu);opacity:.7}
.sl{font-size:11px;color:var(--mu)}
.sv{font-size:11px;font-variant-numeric:tabular-nums}
.sb.cur .sl{color:var(--tx);font-weight:700}
.legend{font-size:11px;color:var(--mu);margin-top:6px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.brandrow{display:flex;justify-content:space-between;align-items:center;padding:2px 0}

.elist{margin:2px 0 0 36px}
.elist0{margin:6px 0 0}
.eitem{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:2px 0;gap:6px}
.eitem span:first-child{min-width:0;overflow-wrap:anywhere}
.eitem b{font-variant-numeric:tabular-nums;font-weight:600}
.x{background:none;border:0;color:var(--mu);font-size:15px;padding:0 10px;min-height:40px;min-width:40px;border-radius:10px}
.x.arm{background:var(--bad);color:#fff;font-size:13px}

/* 設定面板 */
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:11px 14px;border-radius:8px;font-size:14px}

<script>
const MODE='pwa';
const CATS={
  cup:{name:'手搖',icon:'🥤',count:true,limitLabel:'每期可喝幾杯',defLimit:3,defPeriod:'week',hint:'名稱'},
  acc:{name:'飾品',icon:'💍',count:false,limitLabel:'每期預算（元）',defLimit:1000,defPeriod:'month',hint:'名稱'},
  food:{name:'外送',icon:'🛵',count:false,limitLabel:'每期預算（元）',defLimit:600,defPeriod:'week',hint:'店家'}
};
const KEYS=Object.keys(CATS);
const isHidden=k=>!!(S.opts&&S.opts.hide&&S.opts.hide[k]);   // 設定裡被收起來的項目(記帳用 cup/acc/food,作息用 l_ 開頭)
const VK=()=>KEYS.filter(c=>!isHidden(c));
const BRANDS=['50嵐','清心福全','可不可熟成紅茶','迷客夏','大苑子','CoCo都可','麥吉','五桐號','一沐日','龜記','老賴茶棧','得正','COMEBUY','鮮茶道','MR.WISH','青山','珍煮丹','茶湯會','麻古茶坊','鶴茶樓','康青龍','約翰紅茶','天仁茗茶','先喝道','烏弄','八曜和茶','圓石禪茶','再睡5分鐘','日出茶太','春水堂','星巴克','路易莎','85度C'];
const KEY='quota-hp-v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
function norm(){
  if(!S||typeof S!=='object')S={};
  S.cats=S.cats||{};
  for(const k of KEYS){
    const d=S.cats[k]=S.cats[k]||{};
    if(typeof d.limit!=='number')d.limit=CATS[k].defLimit;
    d.period=d.period||CATS[k].defPeriod;
    d.entries=Array.isArray(d.entries)?d.entries:[];
    d.plans=Array.isArray(d.plans)?d.plans:[];
  }
  S.customBrands=Array.isArray(S.customBrands)?S.customBrands:[];
  S.opts=S.opts&&typeof S.opts==='object'?S.opts:{};
  if(typeof S.opts.pet!=='boolean')S.opts.pet=true;
  if(typeof S.opts.mascot!=='boolean')S.opts.mascot=true;
  if(!S.opts.hide||typeof S.opts.hide!=='object'||Array.isArray(S.opts.hide))S.opts.hide={};
  const P=S.pet=S.pet&&typeof S.pet==='object'?S.pet:{};
  if(typeof P.unseen!=='number')P.unseen=0;
  if(typeof P.exp!=='number')P.exp=0;
  if(typeof P.winStreak!=='number')P.winStreak=0;
  P.checks=Array.isArray(P.checks)?P.checks:[];
  P.settled=P.settled&&typeof P.settled==='object'?P.settled:{};
  P.log=Array.isArray(P.log)?P.log:[];
  P.claims=Array.isArray(P.claims)?P.claims:[];
  L.norm();
}
/* ===== 作息飲食(睡眠、飲食、運動、喝水)。資料放在 S.life,跟額度屋一起存/同步 ===== */
const L = (() => {
const CATS = {
  sleep: { name: '睡眠', icon: '🌙' },
  food:  { name: '飲食', icon: '🍱' },
  exercise: { name: '運動', icon: '🏃' },
  water: { name: '喝水', icon: '💧' }
};
const KEYS = Object.keys(CATS);
const vis = c => !isHidden('l_' + c);
const visK = () => KEYS.filter(vis);
const anyVisible = () => visK().length > 0;

const pad = n => String(n).padStart(2, '0');
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmtT = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const WD = ['日', '一', '二', '三', '四', '五', '六'];

const LS = () => S.life;
const today = () => ds(new Date());
let sel = today(), view = 'day', setCat = '', msgCat = '', foodPick = false, picks = [], openK = {}, exSel = '', drinkSugar = '半糖', mealSel = '', armed = null, msg = '';
const now = new Date();
let logYM = [now.getFullYear(), now.getMonth()];

/* ---- 睡眠計算 ---- */
const dur = (bed, wake) => (((toMin(wake) - toMin(bed)) % 1440) + 1440) % 1440 / 60;
const sleepGoalH = () => dur(LS().sleep.tgtBed, LS().sleep.tgtWake) || 8;
const sleepH = k => { const e = LS().sleepLog[k]; return e && e.length ? e.reduce((a, s) => a + dur(s.bed, s.wake), 0) : null; };
// 沿最短方向把 cur 往 tgt 挪 s 分鐘
function shift(cur, tgt, s) {
  const d = (((tgt - cur + 720) % 1440) + 1440) % 1440 - 720;
  return cur + Math.sign(d) * Math.min(Math.abs(d), s);
}
function planFor(k) {
  const c = LS().sleep, n = Math.max(0, Math.round((parse(k) - parse(c.start)) / 864e5)), s = n * c.step;
  const bed = shift(toMin(c.curBed), toMin(c.tgtBed), s), wake = shift(toMin(c.curWake), toMin(c.tgtWake), s);
  const gap = t => Math.abs((((toMin(t[0]) - toMin(t[1]) + 720) % 1440) + 1440) % 1440 - 720);
  const total = Math.ceil(Math.max(gap([c.tgtBed, c.curBed]), gap([c.tgtWake, c.curWake])) / c.step);
  return { bed, wake, n, total, done: n >= total };
}

/* ---- 飲食計算 ---- */
function goalKcal() {
  const p = LS().prof;
  const bmr = 10 * p.w + 6.25 * p.h - 5 * p.age + (p.sex === 'm' ? 5 : -161);
  const tdee = bmr * +p.act;
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), goal: Math.max(p.sex === 'm' ? 1500 : 1200, Math.round(tdee + +p.goal)) };
}
const foodOf = k => LS().food.filter(f => f.date === k);
const kcalOf = k => foodOf(k).reduce((a, f) => a + f.kcal, 0);
const waterOf = k => LS().water[k] || 0;

/* ---- 運動計算 ---- */
// [名稱, MET];消耗大卡 = MET × 體重(kg) × 小時
const EX_TYPES = [['走路', 3.5], ['健走', 4.3], ['慢跑', 7], ['快跑', 9.8], ['騎腳踏車', 6.8], ['游泳', 6], ['重量訓練', 5], ['瑜珈', 2.5], ['伸展', 2.3], ['跳繩', 11], ['有氧・舞蹈', 6.5], ['球類(羽球、籃球)', 5.5], ['爬樓梯', 8], ['爬山', 6.5]];
const exOf = k => LS().exercise.filter(e => e.date === k);
const exMin = k => exOf(k).reduce((a, e) => a + e.min, 0);
const EX_WEEK_GOAL = 5;
const EX_RANKS = [[0, '運動新手'], [5, '小跑者'], [15, '習慣養成'], [30, '運動達人'], [60, '傳奇鐵人']];
const exDone = k => exMin(k) >= LS().exGoal;
function exStreak() {
  const d = new Date(); if (!exDone(ds(d))) d.setDate(d.getDate() - 1); // 今天還沒達標不算斷
  let n = 0; while (exDone(ds(d))) { n++; d.setDate(d.getDate() - 1); } return n;
}
function exTotalDays() { return [...new Set(LS().exercise.map(e => e.date))].filter(exDone).length; }
const rankName = () => exRank().name;
function exRank() {
  const t = exTotalDays(); let i = 0; EX_RANKS.forEach(([n], j) => { if (t >= n) i = j; });
  const nx = EX_RANKS[i + 1];
  return { name: EX_RANKS[i][1], total: t, next: nx ? nx[0] - t : 0, nextName: nx ? nx[1] : '' };
}
function exWeekDays(k) {
  const d = parse(k), s0 = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7)), out = [];
  for (let i = 0; i < 7; i++) { const x = new Date(s0.getFullYear(), s0.getMonth(), s0.getDate() + i); out.push({ k: ds(x), w: WD[x.getDay()] }); }
  return out;
}
function toast(m) {
  const t = document.createElement('div'); t.className = 'ltoast'; t.textContent = m; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}
const exKcal = k => exOf(k).reduce((a, e) => a + e.kcal, 0);

/* ---- 血條 ---- */
function health(c) {
  let q, u, ratio, col;
  if (c === 'sleep') {
    q = sleepGoalH(); const h = sleepH(sel); u = h || 0; ratio = q ? u / q : 0;
    col = !h ? 'var(--c-lsleep)' : ratio >= 0.9 ? 'var(--ok)' : ratio >= 0.75 ? 'var(--warn)' : 'var(--bad)';
  } else if (c === 'food') {
    q = goalKcal().goal; u = kcalOf(sel); ratio = u / q;
    col = ratio > 1 ? 'var(--bad)' : ratio >= 0.8 ? 'var(--warn)' : 'var(--c-lfood)';
  } else if (c === 'exercise') {
    q = LS().exGoal; u = exMin(sel); ratio = q ? u / q : 0;
    col = ratio >= 1 ? 'var(--ok)' : 'var(--c-lexercise)';
  } else {
    q = LS().waterGoal; u = waterOf(sel); ratio = q ? u / q : 0;
    col = ratio >= 1 ? 'var(--ok)' : 'var(--c-lwater)';
  }
  return { q, u, ratio, fill: Math.max(0, Math.min(100, ratio * 100)), col };
}
// 睡眠、喝水是「越多越好」,飲食是「超過就紅」
function pctColor(c, h) {
  if (c === 'food') return h.ratio > 1 ? 'var(--bad)' : h.ratio >= 0.8 ? 'var(--warn)' : 'var(--mu)';
  if (c === 'sleep' && sleepH(sel)) return h.col;
  return 'var(--mu)';
}
// 小兔表情:睡眠看睡得夠不夠、飲食超標就難過、運動和喝水越多越開心
const MASCOT = { sleep: 'sleep', food: 'meal', exercise: 'move', water: 'water' };
function lifeMood(c, h) {
  if (c === 'sleep') return !sleepH(sel) ? 'normal' : h.ratio >= 0.9 ? 'happy' : h.ratio >= 0.75 ? 'normal' : 'sad';
  if (c === 'food') return !h.u ? 'normal' : h.ratio > 1 ? 'sad' : h.ratio >= 0.8 ? 'normal' : 'happy';
  if (h.ratio >= 1) return 'happy';
  if (c === 'water') return h.ratio >= 0.5 ? 'normal' : 'sad';
  return h.ratio > 0 || sel === today() ? 'normal' : 'sad';
}
function dayLabel() {
  const d = parse(sel), t = ds(new Date());
  return sel === t ? '今天' : (d.getMonth() + 1) + '/' + d.getDate();
}
function statRows(c, h) {
  const row = (a, b, cc, main) => `<span class="srow ${main ? 'main' : ''}"><span>${a}</span><span>${b}</span><span>${cc || ''}</span></span>`;
  let r = '';
  if (c === 'sleep') {
    const hr = sleepH(sel), p = planFor(sel);
    r += hr == null
      ? row(dayLabel(), '還沒記錄睡眠', '目標 ' + h.q.toFixed(1) + ' 小時', true)
      : row(dayLabel(), `睡了 <b>${hr.toFixed(1)}</b> 小時 ／ ${h.q.toFixed(1)}`, hr >= h.q ? '達標' : `差 ${(h.q - hr).toFixed(1)}h`, true);
    r += row('建議', `<b>${fmtT(p.bed)}</b> 睡 → <b>${fmtT(p.wake)}</b> 起`, p.done ? '已到位' : `第${p.n + 1}/${p.total + 1}天`);
  } else if (c === 'food') {
    const g = goalKcal(), left = g.goal - h.u, cut = fmtT(planFor(sel).bed - 180);
    r += row(dayLabel(), `已吃 <b>${h.u}</b> ／ ${g.goal} 大卡`, left < 0 ? `<span class="over">超 ${-left}</span>` : '剩 ' + left, true);
    r += row('建議', `最後一餐 <b>${cut}</b> 前吃完`, '睡前3小時');
  } else if (c === 'exercise') {
    const left = h.q - h.u;
    r += row(dayLabel(), `運動 <b>${h.u}</b> ／ ${h.q} 分鐘`, left > 0 ? '還差 ' + left : '達標', true);
    r += row('消耗', `約 <b>${exKcal(sel)}</b> 大卡`, '依體重估算');
  } else {
    const left = h.q - h.u;
    r += row(dayLabel(), `喝了 <b>${h.u}</b> ／ ${h.q} 杯`, left > 0 ? '還差 ' + left : '達標', true);
    r += row('', '每杯約 250ml', '');
  }
  return `<span class="srows">${r}</span>`;
}

// 半小時一格的時間下拉;若現有值不在格子上(例如舊資料),多補一個選項保留
function timeSel(val, attrs) {
  const opts = [];
  for (let m = 0; m < 1440; m += 30) opts.push(fmtT(m));
  if (!opts.includes(val)) { opts.push(val); opts.sort(); }
  return `<select ${attrs}>${opts.map(t => `<option value="${t}" ${t === val ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
}
const snap30 = m => fmtT(Math.round(m / 30) * 30);
// 沒記錄的那天,預設帶入最近一筆更早的紀錄(通常是前一天)
function prevSleep(k) {
  const d = Object.keys(LS().sleepLog).filter(x => x < k).sort().pop();
  const seg = d && LS().sleepLog[d][0];
  return seg ? { d, ...seg } : null;
}
function sleepBody() {
  const segs = LS().sleepLog[sel] || [], p = planFor(sel), last = segs[segs.length - 1];
  const pv = last ? null : prevSleep(sel);
  // 已有睡眠段時,新的一段預設從上一段起床接著開始(適合補午睡、分段睡)
  const defBed = last ? last.wake : pv ? pv.bed : snap30(p.bed);
  const defWake = last ? fmtT(toMin(last.wake) + 60) : pv ? pv.wake : snap30(p.wake);
  let h = segs.length ? `<div class="elist0">` + segs.map((s, i) => `<div class="eitem"><span>第 ${i + 1} 段　${s.bed} → ${s.wake}</span><span class="row"><b>${dur(s.bed, s.wake).toFixed(1)} 小時</b>
    <button class="x ${armed === 's' + sel + ':' + i ? 'arm' : ''}" onclick="L.delSleep(${i})" aria-label="刪除">${armed === 's' + sel + ':' + i ? '確定刪除' : '✕'}</button></span></div>`).join('') + `</div>` : '';
  h += `<div class="erow"><div style="flex:1"><label style="margin-top:0">上床時間</label>${timeSel(defBed, 'id="lb"')}</div>
    <div style="flex:1"><label style="margin-top:0">起床時間</label>${timeSel(defWake, 'id="lw"')}</div>
    <button class="add" style="margin-top:20px" onclick="L.saveSleep()">${segs.length ? '加一段' : '記下'}</button></div>`;
  if (pv) h += `<div class="mu" style="margin-top:6px">已帶入 ${+pv.d.slice(5, 7)}/${+pv.d.slice(8)} 的時間,有不同再改,按「記下」才會存。</div>`;
  if (segs.length > 1) h += `<div class="mu" style="margin-top:6px">共 ${segs.length} 段,合計 ${sleepH(sel).toFixed(1)} 小時</div>`;
  if (msg && msgCat === 'sleep') h += `<div class="note bad">${esc(msg)}</div>`;
  return h;
}

const SUGAR = { 全糖: 1, 半糖: 0.5, 微糖: 0.25, 無糖: 0 };
const findBrand = n => BRANDS.find(b => b.name === n);
// 某個來源('base' = 常見食物,或品牌名)的品項,順序固定,供點選時用 index 取回
function itemsOf(src) {
  if (src === 'base') {
    const out = [];
    for (const [, a] of allFoods()) for (const [n, k] of a) out.push({ name: n, label: n, kcal: k });
    return out;
  }
  const b = findBrand(src);
  if (!b) return [];
  if (b.drink) return b.items.map(([n, full, free]) => ({ name: b.name + ' ' + n + '(' + drinkSugar + ')', label: n + '(' + drinkSugar + ')', kcal: Math.round(free + (full - free) * SUGAR[drinkSugar]) }));
  return b.items.map(([n, k]) => ({ name: b.name + ' ' + n, label: n, kcal: k }));
}
const picksSum = () => picks.reduce((a, p) => a + p.kcal, 0);
function picksName() {
  const m = {}; picks.forEach(p => m[p.name] = (m[p.name] || 0) + 1);
  return Object.entries(m).map(([n, c]) => c > 1 ? n + '×' + c : n).join('、');
}

function norm() {
  const o = S.life = S.life && typeof S.life === 'object' ? S.life : {};
  if (!o.migrated) { // 把單獨版(作息飲食血條)留在這個瀏覽器的資料搬過來,只做一次
    o.migrated = true;
    try {
      const old = JSON.parse(localStorage.getItem('sleepdiet-hp-v1'));
      if (old && typeof old === 'object') for (const k of ['sleep', 'prof', 'waterGoal', 'sleepLog', 'food', 'water', 'exercise', 'exGoal', 'customFoods']) if (old[k] != null) o[k] = old[k];
    } catch (e) {}
  }
  o.sleep = Object.assign({ curBed: '01:30', curWake: '09:00', tgtBed: '23:00', tgtWake: '07:00', step: 15, start: today() }, o.sleep);
  o.prof = Object.assign({ sex: 'f', age: 30, h: 165, w: 60, act: '1.375', goal: '-300' }, o.prof);
  if (typeof o.waterGoal !== 'number') o.waterGoal = 8;
  o.sleepLog = o.sleepLog && typeof o.sleepLog === 'object' ? o.sleepLog : {};
  o.weightLog = o.weightLog && typeof o.weightLog === 'object' && !Array.isArray(o.weightLog) ? o.weightLog : {};
  // 舊資料一天只有一筆 {bed,wake},改成陣列(一天可有多段)
  for (const k of Object.keys(o.sleepLog)) {
    const v = o.sleepLog[k];
    o.sleepLog[k] = Array.isArray(v) ? v.filter(s => s && s.bed && s.wake) : v && v.bed && v.wake ? [{ bed: v.bed, wake: v.wake }] : [];
    if (!o.sleepLog[k].length) delete o.sleepLog[k];
  }
  o.food = Array.isArray(o.food) ? o.food : [];
  o.water = o.water && typeof o.water === 'object' ? o.water : {};
  o.exercise = Array.isArray(o.exercise) ? o.exercise : [];
  if (typeof o.exGoal !== 'number') o.exGoal = 30;
  o.customFoods = Array.isArray(o.customFoods) ? o.customFoods : [];
}
/* ---- 統計頁 ---- */
let stN = 14;
const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return ds(d); };
const avgOf = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const md = k => { const d = parse(k); return (d.getMonth() + 1) + '/' + d.getDate(); };

// 折線圖。pts: [{k, v}],v 為 null 代表當天沒資料;o.join = 沒資料的日子直接跳過連線(體重用)
function lineSvg(pts, o) {
  const vals = pts.map(p => p.v).filter(v => v != null);
  if (!vals.length) return `<div class="mu" style="padding:18px 0;text-align:center">這段期間還沒有資料</div>`;
  const W = 320, H = 150, l = 34, r = 10, t = 10, b = 22, n = pts.length;
  let lo = Math.min(...vals, o.goal != null ? o.goal : Infinity), hi = Math.max(...vals, o.goal != null ? o.goal : -Infinity);
  const pad = (hi - lo) * 0.2 || 1; lo -= pad; hi += pad; if (o.min0) lo = Math.max(0, lo);
  const X = i => l + (n > 1 ? i * (W - l - r) / (n - 1) : (W - l - r) / 2), Y = v => t + (hi - v) / (hi - lo) * (H - t - b);
  const col = `stroke:var(${o.color})`, tx = 'font-size:10px;fill:var(--mu)';
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="${o.label}">`;
  [hi, (hi + lo) / 2, lo].forEach(v => {
    svg += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${l - 4}" y="${Y(v) + 3}" text-anchor="end" style="${tx}">${v.toFixed(o.dp)}</text>`;
  });
  if (o.goal != null) svg += `<line x1="${l}" x2="${W - r}" y1="${Y(o.goal)}" y2="${Y(o.goal)}" style="stroke:var(--mu)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${W - r}" y="${Y(o.goal) - 3}" text-anchor="end" style="${tx}">目標 ${o.goal.toFixed(o.dp)}</text>`;
  let path = '', pen = false;
  pts.forEach((p, i) => {
    if (p.v == null) { if (!o.join) pen = false; return; }
    path += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1) + ' '; pen = true;
  });
  svg += `<path d="${path}" fill="none" style="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p, i) => { if (p.v != null) svg += `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.2" style="fill:var(--card);${col}" stroke-width="2"/>`; });
  [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i).forEach(i => {
    svg += `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" style="${tx}">${md(pts[i].k)}</text>`;
  });
  return svg + '</svg>';
}

function segDetailHtml(days) {

let dbRef=null,writing=false,dirty=false;
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){msg='手機儲存空間寫入失敗，請先備份';msgCat='io'}
  if(dbRef){dirty=true;flush()}

async function flush(){
  if(writing||!dirty)return;
  writing=true;dirty=false;
  try{await dbRef.set(JSON.parse(JSON.stringify(S)));syncState='已同步'}catch(e){syncState='同步失敗，資料仍在本機'}
  writing=false;
  if(dirty)flush();else{const el=document.getElementById('sync');if(el)el.textContent=syncState}
}
async function initDb(){
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const uid=user?await user.id():null;
    if(!db||!uid)return;
    const ref=db.doc('data/users/'+uid+'/state');
    let first=true;
    ref.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites)return;
      if(snap.exists){
        S=JSON.parse(JSON.stringify(snap.data()));norm();petTick();
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        syncState='已同步';dbRef=ref;render();
      }else if(!snap.metadata.fromCache&&first){
        dbRef=ref;
        if(KEYS.some(k=>S.cats[k].entries.length)){dirty=true;flush()}else{syncState='已連線'}
        render();
      }
      if(!snap.metadata.fromCache)first=false;
    },()=>{syncState='雲端無法使用，資料存在本機';render()});
  }catch(e){}
}

/* ---- 週期計算（以選到的日期所在的那一期為準）---- */
function range(period,ref){
  const r=parse(ref);let s,e;
  if(period==='week'){
    s=new Date(r.getFullYear(),r.getMonth(),r.getDate()-((r.getDay()+6)%7));
    e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+7);
  }else{
    s=new Date(r.getFullYear(),r.getMonth(),1);
    e=new Date(r.getFullYear(),r.getMonth()+1,1);
  }
  return [ds(s),ds(e)];
}
function used(c,ref){
  const [s,e]=range(S.cats[c].period,ref);
  return S.cats[c].entries.filter(x=>x.date>=s&&x.date<e).reduce((a,x)=>a+(CATS[c].count?1:x.amt),0);
}
function prevRef(c,ref){
  const d=parse(range(S.cats[c].period,ref)[0]);d.setDate(d.getDate()-1);return ds(d);
}
const carry=(c,ref)=>Math.max(0,used(c,prevRef(c,ref))-S.cats[c].limit);
const quota=(c,ref)=>Math.max(0,S.cats[c].limit-carry(c,ref));
const fmt=(c,v)=>CATS[c].count?v+' 杯':'$'+Math.round(v).toLocaleString();
function plabel(c,ref){
  const p=S.cats[c].period,[s,e]=range(p,ref),t=ds(new Date());
  const cur=t>=s&&t<e;
  if(p==='month')return cur?'本月':(parse(s).getMonth()+1)+'月';
  const a=parse(s),b=parse(e);b.setDate(b.getDate()-1);
  return cur?'本週':(a.getMonth()+1)+'/'+a.getDate()+'–'+(b.getMonth()+1)+'/'+b.getDate();
}
function usedP(c,p,ref){
  const [a,b]=range(p,ref);
  return S.cats[c].entries.filter(x=>x.date>=a&&x.date<b).reduce((q,x)=>q+(CATS[c].count?1:x.amt),0);
}
function health(c){
  const q=quota(c,sel),u=used(c,sel),left=q-u;
  const ratio=q>0?u/q:(u>0?2:0);
  const fill=Math.max(0,Math.min(100,ratio*100));
  const col=ratio>1?'var(--bad)':ratio>=0.8?'var(--warn)':'var(--c-'+c+')';
  return {q,u,left,ratio,fill,col};
}

const IMGKEY={cup:'cup',acc:'shop',food:'food'};
function mood(h){return h.ratio>1?'sad':h.ratio>=0.8?'normal':'happy'}
function statRows(c,hh){
  const D=S.cats[c],C=CATS[c],f=v=>C.count?v+' 杯':'$'+Math.round(v).toLocaleString();
  const rows=[['week','本週'],['month','本月']].map(([p,lab])=>{
    const u=usedP(c,p,sel);
    if(p===D.period){
      return `<span class="srow main"><span>${lab}</span><span>已${C.count?'喝':'用'} <b>${f(u)}</b> ／ ${f(hh.q)}</span><span class="${hh.left<0?'over':''}">${hh.left<0?'超支 '+f(-hh.left):'剩 '+f(hh.left)}</span></span>`;
    }
    return `<span class="srow"><span>${lab}</span><span>已${C.count?'喝':'用'} <b>${f(u)}</b></span><span></span></span>`;
  });
  return `<span class="srows">${rows.join('')}</span>`;
}
function catsHtml(){
  let h='';
  return h+VK().map(c=>{
    const C=CATS[c],hh=health(c),n=Math.max(hh.q,hh.u),isOpen=curCat===c;
    const im=IMG[IMGKEY[c]+'_'+mood(hh)];
    const meter=C.count&&n>0&&n<=8
      ?`<span class="cups">`+Array.from({length:n},(_,i)=>`<span class="cup ${i<hh.u?'on':''} ${i>=hh.q?'over':''}">${C.icon}</span>`).join('')+`</span>`
      :`<span class="hp" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(hh.fill)}"><i style="width:${hh.fill}%;background:${hh.col}"></i></span>`;
    return `<div class="card cat ${isOpen?'open':''}" style="--c:var(--c-${c})">
      <div class="bar ${S.opts.mascot?'':'nomas'}" role="button" tabindex="0" aria-expanded="${isOpen}" onclick="toggleOpen('${c}')" onkeydown="if(event.key==='Enter')toggleOpen('${c}')">
        ${im&&S.opts.mascot?`<img class="bm" src="${im}" alt="">`:`<span class="bm" style="font-size:34px;text-align:center">${C.icon}</span>`}
        <span class="bn"><b>${C.name}<span class="pct" style="color:${hh.ratio>1?'var(--bad)':hh.ratio>=0.8?'var(--warn)':'var(--mu)'}">${Math.round(Math.min(hh.ratio,9.99)*100)}%</span></b><span class="mu">${plabel(c,sel)}${pprog(c)}</span></span>
        <span class="acts">${C.count?`<button class="qbtn" onclick="event.stopPropagation();quick('${c}')" aria-label="快速記一杯">＋</button>`:''}
        <button class="gear ${isOpen&&setOpen?'on':''}" onclick="event.stopPropagation();gear('${c}')" aria-label="${C.name}設定">設定</button></span>
        ${meter}
        ${statRows(c,hh)}
      </div>
      ${C.count?'':`<div class="qrow"><input id="qa-${c}" type="number" inputmode="decimal" placeholder="輸入金額，按＋記下" value="${esc(qv[c]||'')}" oninput="qv['${c}']=this.value" onkeydown="if(event.key==='Enter')qadd('${c}')" aria-label="${C.name}金額">
        <button class="qbtn" onclick="qadd('${c}')" aria-label="記下${C.name}">＋</button></div>`}
      ${isOpen?`<div class="catbody">${entriesHtml(c)}${setOpen?settingsHtml(c):''}</div>`:''}
    </div>`;
  }).join('');
}
const short=n=>n>=1000?(Math.round(n/100)/10)+'k':String(Math.round(n));
function weekInfo(ref){
  const t=parse(ds(new Date())),r=parse(ref);
  const s0=new Date(r.getFullYear(),r.getMonth(),r.getDate()-((r.getDay()+6)%7));
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date(s0.getFullYear(),s0.getMonth(),s0.getDate()+i);

const TITLES=['見習小兔','節制小兔','存錢小兔','精打細算兔','理財達人兔','額度守護兔','傳說額度兔'];
const need=L=>20*L*(L-1);
function petLevel(exp){let L=1;while(need(L+1)<=exp)L++;return L}
const petTitle=L=>TITLES[Math.min(Math.floor((L-1)/3),TITLES.length-1)];
function addExp(n,msg,out){
  const P=S.pet,before=petLevel(P.exp);
  P.exp+=n;
  P.log.unshift({t:Date.now(),msg,exp:n});
  if(P.log.length>30)P.log.length=30;
  out.push((n?'+'+n+' ':'')+msg);
  const after=petLevel(P.exp);
  if(after>before){
    out.push('升級了！Lv.'+after+' '+petTitle(after));
    const nu=FURN.filter(f=>f[2]>tierOf(before)&&f[2]<=tierOf(after));
    if(nu.length)out.push('小兔的家解鎖新家具：'+nu.map(f=>f[1]).join('、'));
  }
}
function checkStreak(){
  const set=new Set(S.pet.checks);let n=0,d=parse(ds(new Date()));
  while(set.has(ds(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
/* ---- 每週任務 ---- */
const weekStart=ref=>range('week',ref)[0];
const weeklyBudget=c=>{const D=S.cats[c];return D.period==='week'?D.limit:D.limit/4.33};
function genTasks(){
  const list=[];
  for(const c of VK()){
    const wb=weeklyBudget(c);
    let target=CATS[c].count?Math.floor(wb*0.8):Math.round(wb*0.8/10)*10;
    if(CATS[c].count&&target>=wb)target=Math.floor(wb)-1;
    if(target<1)continue;
    list.push({id:'save-'+c,kind:'save',c,target,reward:20});
  }
  list.push({id:'checkin',kind:'checkin',target:5,reward:15});
  return list;
}
function taskLabel(t){
  if(t.kind==='checkin')return '本週至少簽到 '+t.target+' 天';
  return CATS[t.c].count?'本週手搖不超過 '+t.target+' 杯':'本週'+CATS[t.c].name+'不超過 $'+t.target.toLocaleString();
}
function taskStat(t,wk){
  const [a,b]=range('week',wk),chk=S.pet.checks.filter(x=>x>=a&&x<b).length;
  if(t.kind==='checkin')return {cur:chk,ok:chk>=t.target,evidence:true};
  const u=usedP(t.c,'week',wk),ents=S.cats[t.c].entries.filter(x=>x.date>=a&&x.date<b).length;
  return {cur:u,ok:u<=t.target,evidence:ents>0||chk>=3};
}
function claimTask(key){
  const i=S.pet.claims.findIndex(x=>x.key===key);if(i<0)return;
  const c=S.pet.claims.splice(i,1)[0],out=[];
  addExp(c.reward,c.msg,out);persist();lastQuick=null;showToast(out.join('　'));render();
}
function claimAll(){
  const out=[];
  for(const c of S.pet.claims.splice(0))addExp(c.reward,c.msg,out);
  persist();lastQuick=null;showToast(out.slice(0,3).join('　'));render();
}
function petTick(today){
  if(!S.opts.pet)return [];
  today=today||ds(new Date());
  const P=S.pet,out=[];let changed=false;
  if(!P.since){P.since=today;changed=true}
  // 簽到改成手動：到「花小兔的家」按簽到（見 checkIn）
  // 每週任務：新的一週出題，上一週達成的放進「可領取」
  {
    const wk=weekStart(today),T=P.tasks;
    if(!T||!Array.isArray(T.list)){P.tasks={week:wk,list:genTasks()};changed=true}
    else if(T.week<wk){
      let won=0;
      for(const t of T.list){
        const st=taskStat(t,T.week);
        if(st.ok&&st.evidence){P.claims.push({key:T.week+':'+t.id,msg:taskLabel(t)+'・任務完成',reward:t.reward});won++}
      }
      if(P.claims.length>12)P.claims=P.claims.slice(-12);
      if(won)out.push('上週任務完成 '+won+' 個，到花小兔的家領獎勵');
      P.tasks={week:wk,list:genTasks()};changed=true;
    }
  }
  // 期末結算：只結算已經結束的期，每期每項只算一次；超支不扣經驗
  const items=[];
  for(const c of KEYS){
    const D=S.cats[c];
    let start=range(D.period,P.since)[0],guard=0;
    while(guard++<150){
      const [a,b]=range(D.period,start);
      if(b>today)break;
      const key=c+':'+a;
      if(!P.settled[key]){
        const u=used(c,a),q=quota(c,a);
        const ents=D.entries.filter(x=>x.date>=a&&x.date<b).length;
        const chk=P.checks.filter(x=>x>=a&&x<b).length;
        const ok=u<=q,evidence=ents>0||chk>=3;
        items.push({c,key,end:b,ok,evidence,u,q,p:D.period});
      }
      start=b;
    }
  }
  items.sort((x,y)=>x.end.localeCompare(y.end));
  for(const it of items){
    const lab=CATS[it.c].name+(it.p==='week'?'一週':'一個月');
    let exp=0;
    if(!it.evidence){P.settled[it.key]={ok:it.ok,exp:0,note:'沒有紀錄'}}
    else if(it.ok){
      exp=it.p==='week'?30:80;
      if(it.q>0&&it.u<=it.q*0.5&&it.u>0)exp+=it.p==='week'?10:20;
      P.winStreak++;
      addExp(exp,lab+'達標',out);
      if(P.winStreak%4===0)addExp(50,'達標連勝 '+P.winStreak+' 期',out);
      P.settled[it.key]={ok:true,exp};
    }else{
      P.winStreak=0;
      P.log.unshift({t:Date.now(),msg:lab+'超支了，下次再來',exp:0});
      out.push(lab+'超支了，沒關係下次再來');
      P.settled[it.key]={ok:false,exp:0};
    }
    changed=true;
  }
  if(changed){if(out.length)P.unseen=(P.unseen||0)+out.length;persist()}
  return out;
}
function petMood(){
  const r=Math.max(...VK().map(c=>health(c).ratio));

function petSay(){
  const hs=VK().map(c=>({c,h:health(c)}));

  if(over)return CATS[over.c].name+'超支了，沒關係，下一期慢慢補回來。';
  const warn=hs.find(x=>x.h.ratio>=0.8);
  if(warn)return CATS[warn.c].name+'快用完了，只剩 '+fmt(warn.c,warn.h.left)+'，撐住喔！';
  const st=checkStreak();
  if(S.pet.winStreak>=2)return '已經連續 '+S.pet.winStreak+' 期達標了，太厲害了！';
  if(st>=3)return '連續簽到 '+st+' 天，我都記得喔。';
  const lines=['今天也輕鬆管理就好～','不一定每次都要手搖，喝水也很棒。','你已經做得很好了。','慢慢來，比較快。','額度都還有，放心。'];

}

/* ---- 設定 ---- */
function resetAll(){
  if(!armReset){armReset=true;render();setTimeout(()=>{if(armReset){armReset=false;if(page==='set')render()}},4000);return}
  armReset=false;S={};norm();persist();curCat='cup';showToast('已清除全部資料');lastQuick=null;render();
}
function ioBody(){
  let h=(msg&&msgCat==='io'?`<div class="note bad">${esc(msg)}</div>`:'');
  if(MODE==='pwa')h+=`<button class="btn" onclick="saveFile()">存成檔案（存到「檔案」App）</button>
    <div style="height:8px"></div><button class="btn" onclick="document.getElementById('fi').click()">從檔案還原</button>
    <input id="fi" type="file" accept=".json,application/json" style="display:none" onchange="impFile(this)">`;
  h+=`<label for="io">備份文字：複製存起來；要還原就貼上後按「還原文字」</label>
    <textarea id="io" rows="4">${esc(JSON.stringify(S))}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn" onclick="copyIO()">複製</button><button class="btn" onclick="impIO()">還原文字</button></div>`;
  return h;
}
function setOpt(k,v){
  S.opts[k]=v;
  if(k==='pet'&&!v&&page==='pet')page='set';
  persist();if(k==='pet'&&v)petTick();render();
}
function hideRow(k,icon,name){
  const off=isHidden(k);
  return `<button class="hrow ${off?'off':''}" onclick="toggleHide('${k}')" aria-pressed="${!off}"><span class="nm">${icon} ${name}</span><span class="st">${off?'已隱藏':'顯示中'}</span></button>`;
}
function toggleHide(k){
  S.opts.hide[k]=!S.opts.hide[k];
  if(!S.opts.hide[k])delete S.opts.hide[k];
  persist();render();
}
function optRow(k,title,sub){
  const on=S.opts[k];
  return `<div class="opt"><span>${title}<small>${sub}</small></span><div class="seg"><button class="${on?'on':''}" onclick="setOpt('${k}',true)">開</button><button class="${on?'':'on'}" onclick="setOpt('${k}',false)">關</button></div></div>`;
}
function setPageHtml(){
  let h=`<h2 class="ptitle">設定</h2>
   <div class="card"><h3>顯示與玩法</h3>
    ${optRow('pet','養成玩法','經驗值、等級、花小兔的家。關掉就只剩記帳')}
    ${optRow('mascot','首頁顯示小兔','關掉後首頁只顯示圖示和數字')}</div>
   <div class="card"><h3>顯示項目</h3>
    <div class="mu" style="margin:4px 0 6px">點一列就收起來或顯示。用不到的先收起來，畫面比較乾淨，資料不會刪掉。</div>
    <div class="hgrp">記帳</div>${KEYS.map(c=>hideRow(c,CATS[c].icon,CATS[c].name)).join('')}
    <div class="hgrp">作息（全部收起來，底部的「作息」也會不見）</div>${Object.keys(L.CATS).map(c=>hideRow('l_'+c,L.CATS[c].icon,L.CATS[c].name)).join('')}</div>
   <div class="card"><h3>各項額度</h3>
    <div class="mu" style="margin:4px 0 8px">週期和額度，回首頁點卡片右邊的「設定」修改。</div>
    ${VK().map(c=>{const D=S.cats[c];return `<div class="kv"><span>${CATS[c].icon} ${CATS[c].name}</span><b>每${D.period==='week'?'週':'月'} ${fmt(c,D.limit)}</b></div>`}).join('')}</div>
   <div class="card"><h3>手搖品牌</h3>
    <div class="mu" style="margin:4px 0 8px">加你常喝、清單沒有的品牌，會出現在手搖的下拉選單。</div>
    <div class="erow" style="margin-top:0"><input id="nb" placeholder="品牌名稱" autocomplete="off" onkeydown="if(event.key==='Enter')addBrand()"><button class="add" style="--c:var(--c-cup)" onclick="addBrand()">加入</button></div>
    ${S.customBrands.map((b,i)=>`<div class="brandrow"><span>${esc(b)}</span><button class="x" onclick="delBrand(${i})" aria-label="刪除">✕</button></div>`).join('')}</div>
   <div class="card"><h3>備份 / 還原</h3>${ioBody()}</div>
   <div class="card"><h3>清除資料</h3><div class="mu" style="margin:4px 0 8px">會刪掉全部紀錄、預約、設定，以及小兔的等級和經驗，無法復原。請先備份。</div>
    <button class="btn" style="background:${armReset?'var(--bad)':'var(--line)'};color:${armReset?'#fff':'var(--tx)'}" onclick="resetAll()">${armReset?'再按一次確定清除':'清除全部資料'}</button></div>`;
  h+=`<div class="card"><h3>關於</h3><div class="mu" style="margin-top:4px">${MODE==='art'?'資料存在你的 Claude 帳號雲端，只有你看得到，手機和電腦同步。':'資料只存在這支手機的瀏覽器裡，不會上傳。清除網站資料會一併消失，請定期備份。'}</div></div>`;
  return h;
}
function tasksHtml(){
  const P=S.pet,T=P.tasks;
  let h='';
  if(P.claims.length){
    h+=`<div class="card"><div class="row sp"><h3>可領取獎勵</h3>${P.claims.length>1?`<button class="x buy" onclick="claimAll()">全部領取</button>`:''}</div>`+
      P.claims.map(c=>`<div class="claim"><span>${esc(c.msg)}</span><button onclick="claimTask('${esc(c.key)}')">領取 +${c.reward}</button></div>`).join('')+`</div>`;
  }
  if(T&&T.list){
    const wk=T.week;
    h+=`<div class="card"><div class="row sp"><h3>本週任務</h3><span class="mu">週日結算，下週一領獎勵</span></div><div style="margin-top:4px">`+
    T.list.map(t=>{
      const st=taskStat(t,wk);let chip,cls,pct,col;
      if(t.kind==='checkin'){
        pct=Math.min(100,st.cur/t.target*100);col='var(--c-acc)';
        chip=st.ok?'已達成':st.cur+' / '+t.target+' 天';cls=st.ok?'ok':'mu';
      }else{
        const C=CATS[t.c],f=v=>C.count?v+' 杯':'$'+Math.round(v).toLocaleString();
        pct=Math.min(100,st.cur/t.target*100);
        if(st.ok){chip='已用 '+f(st.cur)+' / '+f(t.target);cls='mu';col='var(--c-'+t.c+')'}
        else{chip='已超過（'+f(st.cur)+'）';cls='bad';col='var(--bad)'}
      }
      return `<div class="task"><div class="tl"><span>${esc(taskLabel(t))}<span class="mu">　+${t.reward}</span></span><span class="tc ${cls}">${chip}</span></div>
        <div class="xp"><i style="width:${pct}%;background:${col}"></i></div></div>`;
    }).join('')+`</div><div class="mu" style="margin-top:8px">任務是比額度再省一點的挑戰。沒有超過、而且這週有記帳或打開過，才算完成。</div></div>`;
  }
  return h;
}
/* ---- 小兔的房子：升級（稱號）解鎖家具，每件可擺出來／收起來 ---- */
// 稱號階級 1~7（每 3 級換一個稱號）；圖用 IMG['furn_<id>']，還沒有圖的先用表情符號頂著
const tierOf=L=>Math.min(7,Math.floor((L-1)/3)+1);
// [id, 名稱, 解鎖階級, 備用表情, 中心x, 底部y, 寬度]（座標以 400×299 的房間圖為準）
const FURN=[
  ['bed','床',1,'🛏️',104,240,112,0.903],['table','矮圓桌',1,'🪑',150,262,66,0.636],
  ['cup_shelf','手搖杯置物架',2,'🥤',266,194,36,1.674],['cushion','坐墊',2,'🟣',172,268,38,0.911],
  ['piggybank','小豬撲滿',3,'🐷',150,236,28,0.992],['rug','圓地毯',3,'🟠',200,266,140,0.747],
  ['abacus','算盤',4,'🧮',236,266,34,1.006],['lamp','球形檯燈',4,'💡',318,232,15,3.025],
  ['desk','書桌',5,'🗄️',282,252,66,0.725],['plant','盆栽',5,'🪴',92,204,30,1.358],
  ['shield','盾牌',6,'🛡️',205,108,40,1.081],['bookshelf','矮書櫃',6,'📚',304,200,54,0.839],
  ['crown_stand','皇冠展示台',7,'👑',316,268,28,1.143],['trophy','獎盃',7,'🏆',304,157,22,0.953]
];
function roomNorm(){
  const P=S.pet;
  if(!P.room||typeof P.room!=='object')P.room={};
  if(!P.room.off||typeof P.room.off!=='object')P.room.off={};
}
function roomSvg(){
  const R=S.pet.room,L=petLevel(S.pet.exp),im=IMG['cup_'+petMood()],bg=IMG.house_bg,T=tierOf(L);
  let g=`<svg viewBox="0 0 400 299" style="width:100%;height:auto;display:block;border-radius:14px" role="img" aria-label="花小兔的房間">`;
  g+=bg?`<image href="${bg}" width="400" height="299"/>`:`<rect width="400" height="190" fill="#f3e6cf"/><rect y="190" width="400" height="109" fill="#d2a572"/>`;
  const items=FURN.filter(f=>f[2]<=T&&!R.off[f[0]]&&IMG['furn_'+f[0]]).map(f=>({f,z:f[0]==='rug'?-1:f[5]}));
  const draw=o=>{
    const f=o.f,img=IMG['furn_'+f[0]];
    if(img){const w=f[6],h=Math.round(w*f[7]);g+=`<image href="${img}" x="${f[4]-w/2}" y="${f[5]-h}" width="${w}" height="${h}"/>`}
    else g+=`<text x="${f[4]}" y="${f[5]-2}" text-anchor="middle" font-size="${Math.round(f[6]*0.8)}">${f[3]}</text>`;
  };
  items.filter(o=>o.z<252).sort((a,b)=>a.z-b.z).forEach(draw);
  g+=im?`<image href="${im}" x="152" y="136" width="96" height="110" preserveAspectRatio="xMidYMax meet"/>`:`<text x="200" y="230" text-anchor="middle" font-size="70">🐰</text>`;
  items.filter(o=>o.z>=252).forEach(draw);
  return g+'</svg>';
}
function roomHtml(){
  roomNorm();
  const R=S.pet.room,L=petLevel(S.pet.exp),T=tierOf(L);
  const total=FURN.length,got=FURN.filter(f=>f[2]<=T).length;
  const cards=FURN.map(f=>{
    const lock=f[2]>T,on=!lock&&!R.off[f[0]],img=IMG['furn_'+f[0]];
    return `<button class="ropt ${on?'on':''} ${lock?'lock':''}" onclick="roomToggle('${f[0]}')">${img?`<img class="em" src="${img}" alt="">`:`<span class="em">${f[3]}</span>`}<b>${f[1]}</b><small>${lock?'🔒 '+TITLES[f[2]-1]:!img?'圖片製作中':on?'擺放中（再點收起）':'已收起（點一下擺出來）'}</small></button>`;
  }).join('');
  return `<div class="card"><div class="row sp"><h3>小兔的房間</h3><span class="mu">已解鎖 ${got} / ${total}</span></div>
    <div style="margin-top:8px">${roomSvg()}</div>
    <div class="ropts" style="margin-top:10px">${cards}</div>
    <div class="mu" style="margin-top:6px">每升一個稱號（每 3 級）解鎖 2 件新家具。</div></div>`;
}
function roomToggle(id){
  const f=FURN.find(x=>x[0]===id),T=tierOf(petLevel(S.pet.exp)),R=S.pet.room;
  if(f[2]>T){showToast('達到「'+TITLES[f[2]-1]+'」解鎖「'+f[1]+'」');lastQuick=null;render();return}
  if(R.off[id])delete R.off[id];else R.off[id]=true;
  persist();render();
}

/* ---- 手動簽到 ---- */
let ckOpen=false,ckYM=null,justCk='';
function checkinHtml(){
  const P=S.pet,today=ds(new Date()),set=new Set(P.checks),done=set.has(today),st=checkStreak();
  const cell=(k,label)=>{
    const on=set.has(k),now=k===today,fut=k>today;
    return `<div class="ckc ${on?'on':''} ${now?'now':''} ${fut?'fut':''} ${justCk===k?'just':''}">${label?`<span class="w">${label}</span>`:''}<span class="n">${parse(k).getDate()}</span><i>${on?(IMG.cup_happy?`<img src="${IMG.cup_happy}" alt="已簽到">`:'🐾'):''}</i></div>`;
  };
  let cal;
  if(!ckOpen){
    const s0=parse(weekStart(today));
    cal=`<div class="ckweek">`+Array.from({length:7},(_,i)=>{const d=new Date(s0.getFullYear(),s0.getMonth(),s0.getDate()+i);return cell(ds(d),WD[d.getDay()])}).join('')+`</div>`;
  }else{
    if(!ckYM){const t=parse(today);ckYM=[t.getFullYear(),t.getMonth()]}
    const [y,m]=ckYM,first=new Date(y,m,1),dim=new Date(y,m+1,0).getDate(),lead=(first.getDay()+6)%7,pre=y+'-'+pad(m+1)+'-';
    let n=0;for(let d=1;d<=dim;d++)if(set.has(pre+pad(d)))n++;
    cal=`<div class="calhead"><button class="nav2" aria-label="上個月" onclick="ckMove(-1)">‹</button><b>${y}年${m+1}月　簽到 ${n} 天</b><button class="nav2" aria-label="下個月" onclick="ckMove(1)">›</button></div>
      <div class="ckmonth">${['一','二','三','四','五','六','日'].map(w=>`<span class="wd">${w}</span>`).join('')}${'<span></span>'.repeat(lead)}${Array.from({length:dim},(_,i)=>cell(pre+pad(i+1),'')).join('')}</div>`;
  }
  const nextB=[7,14,30].find(x=>x>st);
  return `<div class="card ckcard"><div class="row sp"><h3>每日簽到</h3><span class="mu">連續 <b style="color:var(--tx)">${st}</b> 天</span></div>
    <div style="margin-top:8px">${cal}</div>
    <button class="ckbtn ${done?'done':''}" onclick="checkIn()" ${done?'aria-disabled="true"':''}>${done?'✓ 今天已簽到':'點我簽到　+10 EXP'}</button>
    <div class="row sp" style="margin-top:6px"><span class="mu">${nextB?'連續 '+nextB+' 天有額外獎勵（再 '+(nextB-st)+' 天）':'連續 30 天以上，每天都是滿分'}</span>
      <button class="x" style="font-size:13px" onclick="ckOpen=!ckOpen;render()">${ckOpen?'收起 ▴':'展開整個月 ▾'}</button></div></div>`;
}
function ckMove(n){const d=new Date(ckYM[0],ckYM[1]+n,1);ckYM=[d.getFullYear(),d.getMonth()];render()}
function checkIn(){
  const P=S.pet,today=ds(new Date());
  if(P.checks.includes(today)){showToast('今天已經簽到過了，明天再來！');lastQuick=null;render();return}
  P.checks.push(today);if(P.checks.length>400)P.checks.shift();
  const out=[],lv0=petLevel(P.exp),st=checkStreak();
  addExp(10,'今日簽到',out);
  const bonus={7:30,14:60,30:100}[st];
  if(bonus)addExp(bonus,'連續簽到 '+st+' 天',out);
  persist();justCk=today;setTimeout(()=>{justCk=''},1200);
  render();
  ckFx(10+(bonus||0),st,bonus,petLevel(P.exp)>lv0?out.filter(x=>x.startsWith('升級')||x.startsWith('小兔的家')):[]);
}
function ckFx(total,st,bonus,extra){
  const root=document.createElement('div');root.className='ckfx';
  const em=['🎉','⭐','🥕','✨','💖','🐾'];
  let h='';
  for(let i=0;i<22;i++){
    const a=Math.random()*Math.PI*2,r=90+Math.random()*130;
    h+=`<span class="pt" style="--dx:${Math.round(Math.cos(a)*r)}px;--dy:${Math.round(Math.sin(a)*r-30)}px;--r:${Math.round(Math.random()*540-270)}deg;animation-delay:${Math.round(Math.random()*120)}ms">${em[i%em.length]}</span>`;
  }
  h+=`<div class="ckpop">${IMG.cup_happy?`<img class="rb" src="${IMG.cup_happy}" alt="">`:''}<div class="t">簽到成功！</div><div class="e">+${total} EXP</div><div class="s">連續簽到 ${st} 天${bonus?'　🎁 額外獎勵 +'+bonus:''}</div>${extra.map(x=>`<div class="x2">${esc(x)}</div>`).join('')}</div>`;
  root.innerHTML=h;
  document.body.appendChild(root);
  try{if(navigator.vibrate)navigator.vibrate([30,40,30])}catch(e){}
  setTimeout(()=>{if(root.remove)root.remove()},2600);
}

  const P=S.pet,st=checkStreak();
  return `<h2 class="ptitle">花小兔的家</h2>${petHtml(true)}${roomHtml()}${checkinHtml()}${tasksHtml()}
    <div class="card"><div class="tiles">
      <div class="tile" style="--c:var(--c-cup)"><b>${st} 天</b><span>連續簽到</span></div>
      <div class="tile" style="--c:var(--c-acc)"><b>${P.winStreak} 期</b><span>達標連勝</span></div>
      <div class="tile" style="--c:var(--c-food)"><b>${P.exp}</b><span>累積經驗</span></div></div></div>
    <div class="card"><h3>怎麼拿經驗</h3>
      <div class="kv" style="margin-top:6px"><span>每天點一下簽到</span><b>+10</b></div>
      <div class="kv"><span>連續簽到 7 / 14 / 30 天</span><b>+30 / 60 / 100</b></div>
      <div class="kv"><span>一週沒超支（每項）</span><b>+30</b></div>
      <div class="kv"><span>一個月沒超支（每項）</span><b>+80</b></div>
      <div class="kv"><span>用不到一半額度</span><b>額外 +10 / +20</b></div>
      <div class="kv"><span>每連續達標 4 期</span><b>+50</b></div>
      <div class="kv"><span>每週任務</span><b>+15 ~ +20</b></div>
      <div class="mu" style="margin-top:8px">超支不會扣經驗。整期沒有記錄也沒打開幾次，不算達標。</div></div>`;
}
function syncHtml(){return MODE==='art'?`<div class="sync" id="sync">${esc(syncState)}</div>`:''}
function render(){
  let h='';
  if(page==='home'){
    if(MODE==='pwa'&&stale())h+=`<button class="card" style="width:100%;text-align:left;color:var(--tx)" onclick="go('set')"><b class="warn">超過 30 天沒備份了</b><div class="mu">點這裡到「設定」存成檔案，放進「檔案」App。</div></button>`;
    h+=homeSeg()+calHtml()+catsHtml()+syncHtml();
  }else if(page==='log')h+=homeSeg()+logHtml();
  else if(page==='stats')h+=homeSeg()+statsHtml();
  else if(page==='life')h+=L.html()+syncHtml();
  else if(page==='pet')h+=petPageHtml();
  else h+=setPageHtml()+syncHtml();
  if(toastMsg)h+=`<div class="toast" id="toast"><span>${esc(toastMsg)}</span>${lastQuick?`<button onclick="undoQuick()">復原</button>`:''}</div>`;
  h+=navHtml();
  document.getElementById('app').innerHTML=h;
  refreshPlan();
}
function refreshPlan(){
  const el=document.getElementById('planout');if(!el||!curCat)return;
  const c=curCat,D=S.cats[c],C=CATS[c];
  const pu=C.count?(parseFloat(plan)||0):D.plans.reduce((a,p)=>a+p.amt,0);
  if(!pu){el.innerHTML='';return}
  const after=quota(c,sel)-used(c,sel)-pu,per=D.period==='week'?'週':'月',over=Math.max(0,-after);
  const what=C.count?'買完':'預約的全買下後，';
  el.innerHTML=after>=0
    ?`<div class="note ok">${what}這${per}還剩 ${fmt(c,after)}，下${per}額度維持 ${fmt(c,D.limit)}</div>`
    :`<div class="note bad">${what}這${per}會超支 ${fmt(c,over)}<br>下${per}額度 ${fmt(c,D.limit)} → <b>${fmt(c,Math.max(0,D.limit-over))}</b></div>`;
}

/* ---- 動作 ---- */
function pick(k){sel=k;armed=null;msg='';calOpen=false;render()}
function shiftDay(n){
  const d=parse(sel);d.setDate(d.getDate()+n);
  sel=ds(d);calY=d.getFullYear();calM=d.getMonth();armed=null;msg='';plan='';render();
}
function moveMonth(n){const d=new Date(calY,calM+n,1);calY=d.getFullYear();calM=d.getMonth();render()}
function goToday(){const t=new Date();calY=t.getFullYear();calM=t.getMonth();sel=ds(t);calOpen=false;render()}
function showToast(m){
  toastMsg=m;clearTimeout(toastT);
  toastT=setTimeout(()=>{toastMsg='';lastQuick=null;const t=document.getElementById('toast');if(t&&t.remove)t.remove()},4000);
}
function quick(c){
  if(CATS[c].count){
    const id=Date.now();
    const nm=S.lastBrand&&S.lastBrand!=='__other'?S.lastBrand:'';
    S.cats[c].entries.push({id,date:sel,name:nm,amt:0});
    lastQuick={c,id};persist();showToast('已記一杯'+(nm?'・'+nm:''));render();return;
  }
  curCat=c;setOpen=false;plan='';msg='';render();
  setTimeout(()=>{const e=document.getElementById('am-'+c);if(e&&e.focus)e.focus()},0);
}
const allBrands=()=>BRANDS.concat(S.customBrands.filter(b=>!BRANDS.includes(b)));
function addBrand(){
  const el=document.getElementById('nb'),v=el?el.value.trim():'';
  if(!v){showToast('請輸入品牌名稱');lastQuick=null;render();return}
  if(!allBrands().includes(v))S.customBrands.push(v);
  persist();render();
}
function delBrand(i){S.customBrands.splice(i,1);persist();render()}
function brandChange(v){
  S.lastBrand=v;persist();
  const o=document.getElementById('nm-cup-o');
  if(o){o.hidden=v!=='__other';if(v==='__other')o.focus()}
}
function qadd(c){
  const a=parseFloat(qv[c])||0;
  if(!(a>0)){showToast('請先輸入金額');lastQuick=null;render();return}
  const id=Date.now();
  S.cats[c].entries.push({id,date:sel,name:'',amt:a});
  qv[c]='';lastQuick={c,id};persist();showToast('已記 '+CATS[c].name+' $'+Math.round(a).toLocaleString());render();
}
function undoQuick(){
  if(!lastQuick)return;
  S.cats[lastQuick.c].entries=S.cats[lastQuick.c].entries.filter(x=>x.id!==lastQuick.id);
  lastQuick=null;toastMsg='';clearTimeout(toastT);persist();render();
}
function toggleOpen(c){curCat=curCat===c?null:c;setOpen=false;plan='';msg='';render()}
function gear(c){
  if(curCat!==c){curCat=c;setOpen=true}else setOpen=!setOpen;
  plan='';msg='';render();
}
function setP(c,p){
  const D=S.cats[c];
  if(p!==D.period){
    D.lim=D.lim||{};
    D.lim[D.period]=D.limit;
    // 第一次切到另一個週期：週↔月約 4 倍換算，之後各自記住
    D.limit=D.lim[p]!=null?D.lim[p]:(p==='month'?D.limit*4:Math.max(1,Math.round(D.limit/4)));
    D.lim[p]=D.limit;
  }
  D.period=p;plan='';persist();render()
}
function setL(c,v){const D=S.cats[c];D.limit=Math.max(0,parseFloat(v)||0);D.lim=D.lim||{};D.lim[D.period]=D.limit;persist();render()}
function add(c){
  const C=CATS[c];
  let name=document.getElementById('nm-'+c).value.trim();
  if(c==='cup'&&name==='__other'){const o=document.getElementById('nm-cup-o');name=o?o.value.trim():''}
  const a=parseFloat(document.getElementById('am-'+c).value)||0;
  if(!C.count&&!(a>0)){msg='請輸入'+C.name+'的金額';msgCat=c;render();return}
  msg='';
  S.cats[c].entries.push({id:Date.now(),date:sel,name,amt:a});
  persist();render();
}
function del(c,id){
  if(armed!==id){armed=id;render();setTimeout(()=>{if(armed===id){armed=null;render()}},3000);return}
  armed=null;
  S.cats[c].entries=S.cats[c].entries.filter(x=>x.id!==id);persist();render();
}
function addPlan(c){
  const name=document.getElementById('pn').value.trim();
  const a=parseFloat(document.getElementById('pa').value)||0;
  if(!(a>0)){msg='請輸入預約金額';msgCat=c;render();return}
  msg='';S.cats[c].plans.push({id:Date.now(),name,amt:a});persist();render();
}
function delPlan(c,id){S.cats[c].plans=S.cats[c].plans.filter(p=>p.id!==id);persist();render()}
function buyPlan(c,id){
  const p=S.cats[c].plans.find(x=>x.id===id);if(!p)return;
  const t=new Date();
  S.cats[c].plans=S.cats[c].plans.filter(x=>x.id!==id);
  S.cats[c].entries.push({id:Date.now(),date:ds(t),name:p.name,amt:p.amt});
  calY=t.getFullYear();calM=t.getMonth();sel=ds(t);
  persist();render();
}
function markBk(){try{localStorage.setItem(KEY+'-bk',String(Date.now()))}catch(e){}}
async function saveFile(){
  const txt=JSON.stringify(S),name='額度血條備份.json';
  try{
    const f=new File([txt],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});markBk();msg='';render();return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;a.click();markBk();
  }catch(e){msg='無法存成檔案，請改用複製文字';msgCat='io';render()}
}
function applyBackup(text){
  try{const j=JSON.parse(text);if(!j.cats)throw 0;S=j;norm();persist();showIO=false;msg='';lastQuick=null;showToast('已還原');render()}
  catch(e){msg='備份格式不對';msgCat='io';render()}
}
function impFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>applyBackup(r.result);r.readAsText(f)}
function impIO(){applyBackup(document.getElementById('io').value)}
function copyIO(){
  const t=document.getElementById('io');t.select();
  try{navigator.clipboard.writeText(t.value).catch(()=>{});markBk()}catch(e){}
}
render();
initApp();
</script>

</body>
</html>
